<script>
const DATA = {"TAGS": {"ambition": "Ambition", "language": "Language & technique", "appearance": "Appearance vs reality", "ahead": "Look ahead", "guilt": "Guilt & fear", "lady": "Lady Macbeth", "peel": "★ PEEL evidence"}, "hours": [{"title": "Act 2, Lesson 1", "subtitle": "Scene 2.1: the dagger soliloquy", "steps": [{"type": "aims", "key": "a2h1-aims", "short": "Aims", "mins": 5, "title": "Today’s lesson", "doNow": {"title": "Do now: what do you remember?", "qa": [{"q": "In your Case File, what did you decide Lady Macbeth thinks Macbeth is missing?", "a": "She thinks he has ambition but lacks the “illness” (ruthlessness) that should go with it — she believes he wants power but is too kind to seize it himself."}, {"q": "What did Lady Macbeth ask the spirits to do to her in Act 1 Scene 5?", "a": "To “unsex” her: take away her womanly softness and fill her with cruelty."}, {"q": "By the end of Act 1, was Macbeth ready to commit the murder?", "a": "Yes. He ended Scene 7 saying “I am settled”, though we haven’t yet seen him alone with that decision."}]}}, {"type": "link", "key": "a2l1", "short": "What’s happening", "mins": 4, "title": "Before the soliloquy", "text": "It is almost midnight. Banquo cannot stop thinking about the three {{witches}} and hands his {{sword}} to Fleance for safekeeping before going to bed. Duncan has sent Macbeth a diamond as a gift for Lady Macbeth, calling her his kind hostess. Once Banquo and Fleance leave, Macbeth tells a servant to have Lady Macbeth ring a {{bell}} when his drink is ready. Left alone, he begins to imagine something strange in front of him.", "hinge": {"q": "What does Banquo give to Fleance just before Macbeth enters?", "opts": ["His dagger", "His sword", "A torch", "A jewel"], "correct": 1, "why": "Banquo hands Fleance his sword for safekeeping. The jewel (a diamond) is what Duncan sends Macbeth as a gift for Lady Macbeth, delivered by Banquo."}}, {"type": "extract", "key": "a2e11", "short": "2.1 Dagger", "mins": 15, "label": "Extract 11", "title": "Act 2, Scene 1: Macbeth’s soliloquy", "sub": "The dagger speech", "scene": "2.1", "setup": "Macbeth is alone on stage for the first time since deciding to murder Duncan. This whole speech is a soliloquy: no other character can hear it. Listen for where he argues with himself, and where he finally decides to act.", "think": "With a partner (30 seconds): does Macbeth sound more frightened or more determined by the end of the speech?", "thinkSecs": 30, "task": "Underline the line where Macbeth first doubts that the dagger is real. Circle the line where he decides to go through with the murder.", "lines": [{"k": "sp", "t": "Macbeth"}, {"k": "ln", "n": 44, "t": "Is this a dagger which I see before me,"}, {"k": "ln", "n": 45, "t": "The handle toward my hand? Come, let me clutch"}, {"k": "ln", "n": 46, "t": "thee."}, {"k": "ln", "n": 47, "t": "I have thee not, and yet I see thee still."}, {"k": "ln", "n": 48, "t": "Art thou not, fatal vision, sensible"}, {"k": "ln", "n": 49, "t": "To feeling as to sight? Or art thou but"}, {"k": "ln", "n": 50, "t": "A dagger of the mind, a false creation"}, {"k": "ln", "n": 51, "t": "Proceeding from the heat-oppressèd brain?"}, {"k": "ln", "n": 52, "t": "I see thee yet, in form as palpable"}, {"k": "ln", "n": 53, "t": "As this which now I draw."}, {"k": "st", "t": "He draws his dagger.", "key": "s53"}, {"k": "ln", "n": 54, "t": "Thou marshal’st me the way that I was going,"}, {"k": "ln", "n": 55, "t": "And such an instrument I was to use."}, {"k": "ln", "n": 56, "t": "Mine eyes are made the fools o’ th’ other senses"}, {"k": "ln", "n": 57, "t": "Or else worth all the rest. I see thee still,"}, {"k": "ln", "n": 58, "t": "And, on thy blade and dudgeon, gouts of blood,"}, {"k": "ln", "n": 59, "t": "Which was not so before. There’s no such thing."}, {"k": "ln", "n": 60, "t": "It is the bloody business which informs"}, {"k": "ln", "n": 61, "t": "Thus to mine eyes. Now o’er the one-half world"}, {"k": "gap", "t": "[…Macbeth describes the sleeping world, witchcraft, and withered murder stealing towards its victim like a wolf…]"}, {"k": "ln", "n": 69, "t": "Moves like a ghost. Thou sure and firm-set earth,"}, {"k": "ln", "n": 70, "t": "Hear not my steps, which way they walk, for fear"}, {"k": "ln", "n": 71, "t": "Thy very stones prate of my whereabouts"}, {"k": "ln", "n": 72, "t": "And take the present horror from the time,"}, {"k": "ln", "n": 73, "t": "Which now suits with it. Whiles I threat, he lives."}, {"k": "ln", "n": 74, "t": "Words to the heat of deeds too cold breath gives."}, {"k": "st", "t": "A bell rings.", "key": "s74"}, {"k": "ln", "n": 75, "t": "I go, and it is done. The bell invites me."}, {"k": "ln", "n": 76, "t": "Hear it not, Duncan, for it is a knell"}, {"k": "ln", "n": 77, "t": "That summons thee to heaven or to hell."}, {"k": "st", "t": "He exits.", "key": "s77"}], "notes": [{"id": "a2n11-1", "at": 44, "phrase": "Is this a dagger which I see before me,", "title": "The soliloquy begins", "meaning": "Macbeth is alone on stage and speaks his private thoughts aloud. No other character can hear him: this whole speech is a soliloquy, today’s word.", "effect": "Shakespeare lets us hear Macbeth’s mind working in real time, rather than simply showing us the murder. We watch him decide, rather than just seeing what he decides.", "ask": "Why might Shakespeare want the audience to hear this, rather than just showing us the murder itself?", "tags": ["language"]}, {"id": "a2n11-2", "at": 47, "phrase": "I have thee not, and yet I see thee still.", "title": "Another paradox", "meaning": "Macbeth cannot touch the dagger, and yet he can still see it clearly: two things that shouldn’t both be true at once.", "effect": "This echoes Act 1’s paradoxes (“fair is foul”, “nothing is but what is not”). But this confusion is now happening entirely inside Macbeth’s own head, not from an outside voice.", "ask": "How is this different from the paradoxes the witches spoke in Act 1?", "tags": ["language", "ahead"]}, {"id": "a2n11-3", "from": 48, "to": 51, "title": "Is it real?", "meaning": "Macbeth asks whether the dagger can be felt as well as seen, or whether it is only “a dagger of the mind”, created by his overheated (“heat-oppressèd”) brain.", "effect": "He argues with himself exactly as he did in Act 1 Scene 3 (“cannot be ill, cannot be good”): reasoning out loud instead of simply acting.", "ask": "Does it matter whether the dagger is real, if Macbeth has already decided what to do?", "tags": ["ambition", "language"]}, {"id": "a2n11-4", "at": 54, "phrase": "Thou marshal’st me the way that I was going,", "title": "Leading him on", "meaning": "“Marshal’st” means leads or guides, like a marshal directing troops. The vision doesn’t send Macbeth anywhere new: it only points him towards the murder he had already decided on.", "effect": "This matters for tracking Macbeth’s ambition: his own mind produces this vision. Nothing supernatural is making him kill Duncan.", "ask": "Is Macbeth being led by something outside himself, or by his own ambition?", "tags": ["ambition", "peel"]}, {"id": "a2n11-5", "at": 55, "phrase": "And such an instrument I was to use.", "title": "His own instrument", "meaning": "Macbeth admits the dagger he imagines is the same kind of weapon (“instrument”) he was already planning to use.", "effect": "Compare this with Banquo’s Act 1 warning about the “instruments of darkness”: there, evil forces used small truths to trap men. Here, Macbeth’s own desire has produced the instrument. The temptation is now entirely his own.", "ask": "In Act 1, who or what was the “instrument”? Who, or what, is the instrument now?", "tags": ["ambition", "ahead", "peel"]}, {"id": "a2n11-6", "from": 58, "to": 59, "title": "Blood appears", "meaning": "Fresh blood suddenly appears on the dagger’s blade and handle (“dudgeon”): blood that “was not so before”.", "effect": "This is the first time blood appears in the play as an image inside Macbeth’s own mind, before he has killed anyone. Watch for blood imagery spreading through next lesson’s scene.", "tags": ["language", "ahead", "guilt"]}, {"id": "a2n11-7", "from": 60, "to": 61, "title": "He explains it away — then the night itself seems to change", "meaning": "Macbeth decides the vision comes from the “bloody business” he is about to do, not from anything supernatural.", "effect": "He answers his own question: the dagger isn’t real, it is his guilt and intention showing itself. Straight after this, the speech turns into a description of the whole sleeping world, witchcraft and murder stalking like a wolf (skipped on the page): Macbeth’s language turns darker exactly as his resolve hardens.", "ask": "Why might Shakespeare have Macbeth imagine the whole world turning dark, rather than just thinking about Duncan?", "tags": ["appearance", "guilt", "ahead"]}, {"id": "a2n11-8", "from": 70, "to": 71, "title": "Even the earth might betray him", "meaning": "Macbeth asks the ground itself not to let his footsteps be heard, in case the very stones “prate” (chatter, gossip) about where he is.", "effect": "He is now imagining that even inanimate objects could betray his secret. This nervous, guilty imagination continues the “horrid image” pattern from Act 1 — and will grow far worse next lesson.", "ask": "What does it suggest about Macbeth’s state of mind that he imagines stones being able to talk?", "tags": ["guilt", "language", "ahead"]}, {"id": "a2n11-9", "from": 73, "to": 74, "title": "Enough talking", "meaning": "While Macbeth only threatens Duncan with words, Duncan stays alive. Talking is too cold and slow for an act this urgent (“hot”).", "effect": "He tells himself to stop reasoning and start acting: the turning point from thought to deed.", "ask": "Compare this with “I am settled” at the end of Act 1. What has changed, and what hasn’t?", "tags": ["ambition", "peel"]}, {"id": "a2n11-10", "at": 75, "phrase": "I go, and it is done. The bell invites me.", "title": "The bell as an invitation", "meaning": "The bell, which Lady Macbeth rings as the agreed signal, is described as inviting him, like a welcome guest.", "effect": "Notice how he treats the signal to murder as something pleasant (“invites”). Compare this with the very next lines, where the same bell becomes a funeral bell.", "tags": ["language", "guilt"]}, {"id": "a2n11-11", "from": 76, "to": 77, "title": "A funeral bell for a living man", "meaning": "A “knell” is the sound of a bell rung to announce a death. Macbeth calls the bell a knell for Duncan, who is still alive, summoning him “to heaven or to hell”.", "effect": "This rhyming couplet ends the soliloquy like a spell or a verdict, echoing “fair is foul” and “false face must hide”. Macbeth speaks as though the murder has already happened.", "ask": "Why might Shakespeare end the speech with a rhyming couplet, as he did at the end of Act 1 Scene 7?", "tags": ["language", "ahead", "guilt"]}], "gloss": [["dudgeon", "the wooden handle of a dagger"], ["palpable", "solid enough to touch"], ["heat-oppressèd", "overheated, feverish"], ["marshal’st", "leads, guides (like a marshal directing troops)"], ["sentinel", "a guard, a lookout"], ["prate", "chatter, gossip"], ["knell", "the sound of a bell rung to announce a death"]]}, {"type": "plenary", "key": "a2h1-end", "short": "Exit", "mins": 6, "title": "Exit ticket", "ticket": [{"q": "Find one phrase from the soliloquy that shows Macbeth’s fear or hesitation.", "a": "For example “Hear not my steps… for fear”, or “I have thee not, and yet I see thee still” — any phrase showing doubt or fear is acceptable."}, {"q": "In Act 1, Lady Macbeth said Macbeth was “too full o’ th’ milk of human kindness” to murder. Does this soliloquy support or challenge her judgement of him?", "a": "It mostly challenges it: although he hesitates and argues with himself, he still goes through with the murder by the end of the speech (“I go, and it is done”), showing he is capable of what she doubted."}, {"q": "Ambition tracker: what does Macbeth want at this point, and what is stopping him from going straight to get it?", "a": "He wants to be king and is ready to murder Duncan to get there. What holds him back is his own fear and guilt, not any outside force: notice how the vision pushing him forward comes from his own mind."}], "next": "Next lesson: we go downstairs with Lady Macbeth, straight after the murder, to see who stays in control."}], "aims": {"li": "To explore Macbeth’s dagger soliloquy, and to understand what a soliloquy is and why Shakespeare uses one here.", "sc": ["I can explain what a soliloquy is.", "I can find a phrase in the soliloquy that shows Macbeth’s fear or hesitation.", "I can explain what the dagger vision suggests about where Macbeth’s ambition is coming from."], "word": {"w": "soliloquy", "m": "a speech in which a character speaks their thoughts, alone on stage.", "eg": "Macbeth’s dagger speech is a soliloquy: no one else can hear his private thoughts. Use the word in one sentence today."}, "bridge": "In your Case File you reviewed how Lady Macbeth sees Macbeth’s character before the murder. Tonight, in this scene, Macbeth is alone for the first time since deciding to kill Duncan."}}, {"title": "Act 2, Lesson 2", "subtitle": "Scene 2.2: after the murder", "steps": [{"type": "aims", "key": "a2h2-aims", "short": "Aims", "mins": 5, "title": "Today’s lesson", "doNow": {"title": "Do now: what do you remember?", "qa": [{"q": "What did Macbeth see and argue with, alone on stage last lesson?", "a": "A vision of a dagger, which he decided was “a dagger of the mind” created by his own guilty thoughts."}, {"q": "What signal was Macbeth waiting for before he went to Duncan’s room?", "a": "Lady Macbeth ringing a bell."}, {"q": "What is a soliloquy?", "a": "A speech where a character shares their private thoughts alone on stage."}]}}, {"type": "link", "key": "a2l2", "short": "What’s happening", "mins": 4, "title": "Downstairs, moments later", "text": "Downstairs, Lady Macbeth feels bold because she has drunk the same wine that made Duncan’s {{guards}} fall asleep, and she has left the {{daggers}} ready for Macbeth. When Macbeth returns, badly shaken, he says he has done the {{deed}}. He describes hearing two of the sleeping men wake, say their prayers, and go back to sleep — he could not say ‘{{Amen}}’ with them. He then says he heard a voice cry that he had murdered {{sleep}} itself, and that he will ‘sleep no more’."}, {"type": "extract", "key": "a2e12", "short": "2.2 Control", "mins": 15, "label": "Extract 12", "title": "Act 2, Scene 2: Lady Macbeth takes control", "sub": "Straight after the murder", "scene": "2.2", "setup": "Lady Macbeth is waiting downstairs when Macbeth returns, shaken, with the murder weapons still in his hands. Watch how differently each of them speaks.", "think": "With a partner (30 seconds): find one word or phrase that shows Lady Macbeth is still in control.", "thinkSecs": 30, "task": "Underline one thing Lady Macbeth says that shows she is in control. Circle one thing Macbeth says that shows he has lost his composure.", "lines": [{"k": "sp", "t": "Lady Macbeth"}, {"k": "ln", "n": 58, "t": "Who was it that thus cried? Why, worthy thane,"}, {"k": "ln", "n": 59, "t": "You do unbend your noble strength to think"}, {"k": "ln", "n": 60, "t": "So brainsickly of things. Go get some water"}, {"k": "ln", "n": 61, "t": "And wash this filthy witness from your hand.—"}, {"k": "ln", "n": 62, "t": "Why did you bring these daggers from the place?"}, {"k": "ln", "n": 63, "t": "They must lie there. Go, carry them and smear"}, {"k": "ln", "n": 64, "t": "The sleepy grooms with blood."}, {"k": "sp", "t": "Macbeth"}, {"k": "ln", "n": 65, "t": "I’ll go no more."}, {"k": "ln", "n": 66, "t": "I am afraid to think what I have done."}, {"k": "ln", "n": 67, "t": "Look on ’t again I dare not."}, {"k": "sp", "t": "Lady Macbeth"}, {"k": "ln", "n": 68, "t": "Infirm of purpose!"}, {"k": "ln", "n": 69, "t": "Give me the daggers. The sleeping and the dead"}, {"k": "ln", "n": 70, "t": "Are but as pictures. ’Tis the eye of childhood"}, {"k": "ln", "n": 71, "t": "That fears a painted devil. If he do bleed,"}, {"k": "ln", "n": 72, "t": "I’ll gild the faces of the grooms withal,"}, {"k": "ln", "n": 73, "t": "For it must seem their guilt."}, {"k": "st", "t": "She exits with the daggers. Knock within.", "key": "s73"}], "notes": [{"id": "a2n12-1", "from": 58, "to": 60, "title": "Calm and in control", "meaning": "Lady Macbeth calmly asks who cried out, then tells Macbeth he is “unbending his noble strength” by thinking so “brainsickly” (in a sick, confused way) about what has happened.", "effect": "While Macbeth is falling apart, she stays composed, even flattering him (“worthy thane”) while correcting him. This is the clearest evidence yet of the contrast between them.", "ask": "How does calling him “worthy thane” while criticising him make her seem more, not less, in control?", "tags": ["lady", "peel"]}, {"id": "a2n12-2", "from": 61, "to": 64, "title": "Practical instructions", "meaning": "She gives Macbeth a string of practical, physical tasks: wash his hands, return the daggers, smear the sleeping guards with blood to frame them.", "effect": "Notice the short, direct commands. She thinks in actions and solutions while Macbeth is frozen by what he has done. This is a strong quotation for showing her taking control.", "tags": ["lady", "peel"]}, {"id": "a2n12-3", "from": 65, "to": 67, "title": "Macbeth freezes", "meaning": "Macbeth refuses to go back with the daggers, admits he is afraid even to think about what he has done, and says he dares not look at it again.", "effect": "Compare this with the dagger soliloquy: there he argued and reasoned before acting; here he can barely manage full sentences. His confidence has collapsed.", "ask": "Last lesson Macbeth said “I go, and it is done.” How has his tone changed now that it actually is done?", "tags": ["ambition", "guilt", "ahead"]}, {"id": "a2n12-4", "at": 68, "phrase": "Infirm of purpose!", "title": "Word to know: foil", "meaning": "“Infirm of purpose” means weak-willed, unable to follow through. Lady Macbeth snaps this at Macbeth in frustration.", "effect": "This short, sharp line shows her impatience with his hesitation. Shakespeare places two opposite characters side by side here: her hard decisiveness against his guilt-stricken hesitation. That contrast is what a foil is — today’s word.", "tags": ["lady", "language", "peel"]}, {"id": "a2n12-5", "from": 69, "to": 71, "title": "The sleeping and the dead are “pictures”", "meaning": "She says the sleeping and the dead look the same, “but as pictures”, and only a child (“the eye of childhood”) would be frightened by a painted image of the devil.", "effect": "She reduces murder to something almost harmless, an image rather than a real horror. This tells us how she is managing her own fear, not necessarily that she feels none.", "ask": "Is Lady Macbeth genuinely fearless here, or is she talking herself into it, the way Macbeth did in his soliloquy?", "tags": ["lady", "appearance", "peel"]}, {"id": "a2n12-6", "from": 72, "to": 73, "title": "Gild and guilt", "meaning": "“Gild” means to cover with a gold colour: here, she means smearing the grooms’ faces with blood so that they look guilty.", "effect": "“Gild” and “guilt” sound alike and sit close together, linking the idea of covering something up with the crime itself. This is the “false face” trick from Act 1 Scene 7, now put into action.", "ask": "Where else in the play has “hiding the truth behind a surface” appeared before?", "tags": ["lady", "language", "appearance", "ahead"]}], "gloss": [["unbend", "relax, let go of"], ["brainsickly", "in a sick, confused way"], ["witness", "evidence, proof (here: the blood)"], ["infirm of purpose", "weak-willed, unable to follow through"], ["gild", "cover with a gold colour"], ["withal", "with it, as well"]]}, {"type": "link", "key": "a2l3", "short": "What’s happening", "mins": 3, "title": "The knocking begins", "text": "Someone begins knocking loudly at the gate. Macbeth stares at his bloody hands and imagines that the whole ocean could not wash them {{clean}}; he says the sea itself would turn red instead. Lady Macbeth tells him a little {{water}} is all it takes, and hurries him away to change before the knocking is answered.", "hinge": {"q": "What does Macbeth mean when he says the ocean could not wash the blood from his hand?", "opts": ["The blood is a strange colour.", "His guilt feels too great to ever be washed away.", "He wants to go swimming.", "The water in the castle is dirty."], "correct": 1, "why": "Macbeth imagines the opposite happening — the sea turning red from his hand, not his hand becoming clean. His guilt feels permanent, however much water is used."}}, {"type": "plenary", "key": "a2h2-end", "short": "Exit", "mins": 7, "title": "Exit ticket", "ticket": [{"q": "Find a quotation in the extract that shows Lady Macbeth staying calm and in control.", "a": "For example “Infirm of purpose! / Give me the daggers” or “A little water clears us of this deed.”"}, {"q": "Explain what “’Tis the eye of childhood / That fears a painted devil” suggests about how Lady Macbeth sees fear.", "a": "She compares fear of what you’ve done to a child’s fear of a painted (fake) devil: not real danger, just an image. It suggests she believes guilt and fear are something you can simply choose to ignore."}, {"q": "Ambition tracker: compare Macbeth’s “I am afraid to think what I have done” with his “I go, and it is done” from last lesson. What has changed?", "a": "Before the murder he pushed himself forward with resolve; now that it is done, his confidence has collapsed into guilt and fear. Keep this contrast for comparing him with the very different man we meet in Act 3."}, {"q": "Case File: add one new piece of evidence to your Lady Macbeth Case File from today’s scene.", "a": "Any moment showing her decisiveness, calmness, or control — for example “Infirm of purpose!” or her plan to gild the grooms’ faces with blood."}], "next": "Next lesson: we build the skills for a PEEL paragraph about Lady Macbeth, using the evidence you’ve collected across both lessons."}], "aims": {"li": "To explore how Lady Macbeth manages Macbeth immediately after the murder, and to understand what a foil is.", "sc": ["I can find a quotation showing Lady Macbeth staying calm and in control.", "I can explain what “foil” means and identify how Macbeth and Lady Macbeth act as foils for each other in this scene.", "I can choose the strongest quotation from this scene for a PEEL paragraph about Lady Macbeth."], "word": {"w": "foil", "m": "a character whose traits contrast with another’s, making both characters’ traits stand out.", "eg": "Lady Macbeth’s calm control makes Macbeth’s panic even more obvious, and the other way round. Use the word in one sentence today."}, "bridge": "Last lesson, Macbeth argued with a vision of a dagger, then went to murder Duncan. This scene picks up moments later, downstairs, where Lady Macbeth is waiting."}}], "QUIZ": []};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s) => esc(s).replace(/\[([^\]]+)\]/g, '<i class="sd">[$1]</i>');
const SHORT = { ambition: "Ambition", language: "Language", appearance: "Appearance", ahead: "Look ahead", guilt: "Guilt", lady: "Lady Macbeth", peel: "★ PEEL evidence" };
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ratings are the only thing kept on the device, and only if the browser allows it */
const RKEY = "macbeth-act2-ratings";
function loadRate() { try { return JSON.parse(localStorage.getItem(RKEY) || "{}"); } catch (e) { return {}; } }
function saveRate() { try { localStorage.setItem(RKEY, JSON.stringify(S.rate)); } catch (e) { /* storage unavailable */ } }

/* S.drawer: which side panel is open (null = closed). S.wide / S.mainHidden: how the two panes share the screen. S.focus: extract-only mode. */
const S = { view: "lesson", h: 0, s: 0, tag: "all", sel: null, scale: 1, drawer: null, wide: false, mainHidden: false, focus: false,
  rev: { tab: "quotes", tag: "all", quiz: null }, rate: loadRate(), battle: { r: 0, meter: 20, picked: null } };
const cur = () => DATA.hours[S.h].steps[S.s];
let DR = {}; /* drawers of the step on screen */

/* order notes by position in the text */
DATA.hours.forEach((h) => h.steps.forEach((st) => {
  if (st.type !== "extract") return;
  const posOf = (n) => {
    let i;
    if (n.stage) i = st.lines.findIndex((l) => l.k === "st" && l.key === n.stage);
    else { const ln = n.at !== undefined ? n.at : n.from; i = st.lines.findIndex((l) => l.k === "ln" && l.n === ln); }
    return i * 1000 + (n.phrase && !n.stage ? Math.max(0, (st.lines[i].t || "").indexOf(n.phrase)) : 0);
  };
  st.notes.forEach((n) => (n._pos = posOf(n)));
  st.notes.sort((a, b) => a._pos - b._pos);
}));

const tagOK = (n, tag) => tag === "all" || n.tags.includes(tag);
const match = (n) => tagOK(n, S.tag);
const visible = (st) => st.notes.filter(match);
const byId = (st, id) => st.notes.find((n) => n.id === id);

/* ---------- top bar: lessons menu + navigation ---------- */
function renderTop() {
  $("#lbl").textContent = DATA.hours[S.h].title;
  $("#lmenu").innerHTML = DATA.hours.map((h, i) =>
    `<button class="lm${i === S.h ? " on" : ""}" data-h="${i}"><b>${esc(h.title)}</b><small>${esc(h.subtitle)}</small></button>`).join("");
}
function renderNav() {
  const nav = $("#nav");
  const h = DATA.hours[S.h], n = h.steps.length;
  const first = S.h === 0 && S.s === 0;
  const lastStep = S.s === n - 1, lastAll = S.h === DATA.hours.length - 1 && lastStep;
  const nextLabel = !lastStep ? `Next: ${esc(h.steps[S.s + 1].short)}` : lastAll ? "Finished" : "Next lesson";
  nav.innerHTML =
    `<button class="btn back" data-act="prev" ${first ? "disabled" : ""} aria-label="${S.s === 0 && !first ? "Last lesson" : "Back"}"><i class="ic ic-back"></i><span class="tx">${S.s === 0 && !first ? "Last lesson" : "Back"}</span></button>` +
    `<ol class="steps">` + h.steps.map((s, i) =>
      `<li class="${i < S.s ? "done" : ""}"><button class="stp ${s.type}${i === S.s ? " on" : ""}${i < S.s ? " done" : ""}" data-s="${i}" title="${esc(s.short)} · about ${s.mins} min" ${i === S.s ? 'aria-current="step"' : ""}><span class="pn">${i + 1}</span><span class="pl">${esc(s.short)}</span></button></li>`).join("") + `</ol>` +
    `<button class="btn primary next" data-act="next" ${lastAll ? "disabled" : ""}><span class="tx">${nextLabel}</span><i class="ic ic-next"></i></button>`;
}

/* ---------- bottom bar: theme filters (notes) ---------- */
function chipRow(notes, active) {
  const counts = {};
  notes.forEach((n) => n.tags.forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
  return `<span class="fl">Show notes about</span><button class="chip${active === "all" ? " on" : ""}" data-tag="all">All (${notes.length})</button>` +
    Object.keys(DATA.TAGS).filter((t) => counts[t]).map((t) =>
      `<button class="chip tg-${t}${active === t ? " on" : ""}" data-tag="${t}"><i class="dot"></i>${esc(SHORT[t])} (${counts[t]})</button>`).join("");
}
function renderFilters() {
  const el = $("#filters");
  const st = cur();
  if (st.type !== "extract") { el.hidden = true; return; }
  el.hidden = false;
  const has = new Set(); st.notes.forEach((n) => n.tags.forEach((t) => has.add(t)));
  if (S.tag !== "all" && !has.has(S.tag)) S.tag = "all";
  el.innerHTML = chipRow(st.notes, S.tag);
}

/* ---------- shared pieces ---------- */
function qaCards(qa) {
  return qa.map((q) => `<div class="qa ${q.lvl || ""}" role="button" tabindex="0" data-qa>${q.lvl ? `<span class="lv">${q.lvl === "core" ? "Core" : "Stretch"}</span>` : ""}<div class="qq">${esc(q.q)}</div><div class="aa">${esc(q.a)}</div></div>`).join("");
}
function ratingHTML(h) {
  const A = DATA.hours[h].aims;
  const items = A.stretch ? [...A.sc, A.stretch] : [...A.sc];
  return items.map((t, i) => {
    const v = S.rate[h + ":" + i];
    return `<div class="rate"><p>${A.stretch && i === A.sc.length ? "<b>Stretch:</b> " : ""}${esc(t)}</p><div class="rbtns">` +
      ["Not yet", "Nearly", "Got it"].map((l, k) => `<button class="rb${v === k ? " on" : ""}" data-rate="${h}:${i}:${k}">${l}</button>`).join("") + `</div></div>`;
  }).join("");
}
function clozeParts(text) {
  let i = 0;
  const html = esc(text).replace(/\{\{(.+?)\}\}/g, (m, a) => { i++; return `<span class="gap" data-gap role="button" tabindex="0"><sup>${i}</sup><span class="ans">${esc(a)}</span></span>`; });
  const bank = [...text.matchAll(/\{\{(.+?)\}\}/g)].map((m) => m[1]).sort((a, b) => a.localeCompare(b));
  return { html, bank };
}
function hingeHTML(hg) {
  return `<div class="hinge"><div class="lab">Quick check: vote, then reveal</div><p class="hq">${esc(hg.q)}</p>` +
    hg.opts.map((o, i) => `<button class="opt" data-hinge="${i}">${"ABCD"[i]}&nbsp; ${esc(o)}</button>`).join("") +
    `<div class="row"><button class="ghost small" data-act="hingeshow">Show answer</button></div><div class="hres" hidden></div></div>`;
}
const ideas = (items) => items.map((i) => `<div class="idea"><b>${esc(i.h)}</b><p>${esc(i.t)}</p></div>`).join("");

/* ---------- the extract ---------- */
function annSpans(text, notes) {
  const marks = [];
  notes.forEach((n) => { const i = text.indexOf(n.phrase); if (i >= 0) marks.push({ s: i, e: i + n.phrase.length, n }); });
  marks.sort((a, b) => a.s - b.s);
  let out = "", p = 0;
  marks.forEach((m) => {
    out += fmt(text.slice(p, m.s));
    out += `<span class="ann${match(m.n) ? "" : " dim"}" data-note="${m.n.id}" role="button" tabindex="0">${fmt(text.slice(m.s, m.e))}</span>`;
    p = m.e;
  });
  return out + fmt(text.slice(p));
}
function quoteOf(st, n) {
  if (n.phrase) return n.phrase;
  const ls = st.lines.filter((l) => l.k === "ln" && l.n >= n.from && l.n <= n.to).map((l) => l.t);
  return ls.length > 2 ? ls[0] + " … " + ls[ls.length - 1] : ls.join(" / ");
}
function notePanel(st, n) {
  const vis = visible(st), idx = vis.findIndex((x) => x.id === n.id);
  const tiers = (n.support || n.stretch)
    ? `<div class="tierbtns">${n.support ? `<button class="ghost small" data-act="tog" data-t="sup">Need a starter?</button>` : ""}${n.stretch ? `<button class="ghost small" data-act="tog" data-t="str">Push further</button>` : ""}</div>` +
      (n.support ? `<div class="tier sup" hidden><b>Sentence starter</b>${esc(n.support)}</div>` : "") +
      (n.stretch ? `<div class="tier str" hidden><b>Stretch question</b>${esc(n.stretch)}</div>` : "")
    : "";
  return `<div class="ptop"><span>Note ${idx + 1} of ${vis.length}</span></div>` +
    `<p class="q">${fmt(quoteOf(st, n))}</p><h3>${esc(n.title)}</h3>` +
    `<div class="lab">In plain English</div><p>${esc(n.meaning)}</p>` +
    `<div class="lab">Why it matters</div><p>${esc(n.effect)}</p>` +
    (n.ask ? `<div class="ask"><b>Ask the class</b><p>${esc(n.ask)}</p></div>` : "") + tiers +
    `<div class="tagrow">${n.tags.map((t) => `<span class="chip tg-${t}"><i class="dot"></i>${esc(DATA.TAGS[t])}</span>`).join("")}</div>` +
    `<div class="notenav"><button data-act="pn">◀ Previous note</button><button data-act="nn">Next note ▶</button></div>`;
}
function scenePanel(st) {
  return `<p class="lead">${esc(st.setup)}</p>` +
    (st.think ? `<div class="think"><b>Think first</b><p>${esc(st.think)}</p><button class="ghost small" data-act="timer" data-sec="${st.thinkSecs || 30}">Start timer</button></div>` : "") +
    `<button class="ghost" data-act="firstnote">Open the first note</button>`;
}

/* ---------- what each step shows: one main focus, the rest in drawers ---------- */
const VIEW = {
  aims(st) {
    const A = DATA.hours[S.h].aims;
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: A.bridge || "", rail: "Aims",
      body: `<div class="inner aimsbody"><div class="li"><div class="lab">Learning intention</div><p>${esc(A.li)}</p></div>` +
        `<div class="sc"><div class="lab">Success criteria: by the end of the lesson I can…</div><ul>${A.sc.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>${A.stretch ? `<p class="stretchsc"><b>Stretch:</b> ${esc(A.stretch)}</p>` : ""}</div></div>`,
      drawers: [
        { id: "donow", label: "Do now", cta: true, title: st.doNow.title, html: () => `<p class="hint">Talk in pairs first. Tap a question to check.</p>${qaCards(st.doNow.qa)}<div class="row"><button class="ghost" data-act="timer" data-sec="60">Start a 1-minute timer</button></div>` },
        { id: "word", label: "Word of the lesson", title: "Word of the lesson", html: () => `<div class="word"><b>${esc(A.word.w)}</b> means ${esc(A.word.m)} ${esc(A.word.eg)}</div>` },
      ],
    };
  },
  context(st) {
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.lead, rail: "Cards",
      body: `<div class="inner"><div class="cards">${st.blocks.map((b) => `<div class="fact card" role="button" tabindex="0" data-reveal><h3>${esc(b.h)}</h3><p class="prompt">${esc(b.prompt || "")}</p><p class="txt">${esc(b.t)}</p><span class="tap">Talk first, then tap to check</span></div>`).join("")}</div></div>`,
      drawers: [{ id: "ideas", label: st.side.title, title: st.side.title, html: () => ideas(st.side.items) }],
    };
  },
  extract(st) {
    const phr = {}, rng = {}, stg = {};
    st.notes.forEach((n) => {
      if (n.phrase) { if (n.stage) (stg[n.stage] = stg[n.stage] || []).push(n); else (phr[n.at] = phr[n.at] || []).push(n); }
      else for (let i = n.from; i <= n.to; i++) rng[i] = n;
    });
    const body = st.lines.map((l) => {
      if (l.k === "sp") return `<div class="sp">${esc(l.t)}</div>`;
      if (l.k === "gap") return `<div class="gapline">${fmt(l.t)}</div>`;
      if (l.k === "st") return `<div class="stg">${l.key && stg[l.key] ? annSpans(l.t, stg[l.key]) : fmt(l.t)}</div>`;
      const r = rng[l.n];
      const num = l.n % 5 === 0 ? l.n : "";
      if (r) return `<div class="ln rng${match(r) ? "" : " dim"}" data-note="${r.id}" role="button" tabindex="0"><span class="num">${num}</span><span class="tx">${fmt(l.t)}</span></div>`;
      return `<div class="ln"><span class="num">${num}</span><span class="tx">${annSpans(l.t, phr[l.n] || [])}</span></div>`;
    }).join("");
    return {
      kick: `${st.label} · about ${st.mins} min`, title: st.title, sub: st.sub, rail: "Extract", focus: true,
      body: `<div class="lines">${body}</div><div class="foot">Tap an underlined phrase or highlighted line to open its note. Text: Folger Shakespeare Library edition (folger.edu). Line numbers as printed there.</div>`,
      drawers: [
        { id: "scene", label: "Before you read", title: "Before you read", cta: !!st.think, html: () => scenePanel(st) },
        { id: "note", label: () => `Notes (${visible(st).length})` },
      ],
    };
  },
  link(st) {
    const { html, bank } = clozeParts(st.text);
    const drawers = [];
    if (st.hinge) drawers.push({ id: "hinge", label: "Quick check", cta: true, title: "Quick check", html: () => hingeHTML(st.hinge) });
    if (st.ext) drawers.push({ id: "ext", label: "Stretch", title: "Stretch", html: () => `<p class="stretchsc"><b>Stretch:</b> ${esc(st.ext)}</p>` });
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: "Read aloud and tap each gap to reveal the word.", rail: "Gap-fill",
      actions: `<button class="tb" data-act="reveal">Reveal all</button>`,
      body: `<div class="inner"><div class="lab">Word bank</div><div class="bank">${bank.map((a) => `<span>${esc(a)}</span>`).join("")}</div><p class="cloze">${html}</p></div>`,
      drawers,
    };
  },
  plenary(st) {
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: "Answer on your handout first. Then tap a question to check.", rail: "Exit ticket",
      body: `<div class="inner">${qaCards(st.ticket)}</div>`,
      drawers: [
        { id: "rate", label: "Rate yourself", cta: true, title: "Rate yourself", html: () => `<p class="hint">How well can you do each of today’s success criteria?</p><div id="ratings">${ratingHTML(S.h)}</div>` },
        { id: "next", label: "What’s next", title: "What’s next", html: () => `<div class="track"><p>${esc(st.next)}</p></div>` },
      ],
    };
  },
  practice(st) {
    const kind = { mc: "Multiple choice", tf: "True or false", match: "Matching", short: "Write your answer" };
    const cards = st.qs.map((q) => {
      let body = `<div class="qq">${esc(q.q)}</div>`;
      if (q.k === "mc") body += `<ol class="opts opts-a">${q.opts.map((o) => `<li>${esc(o)}</li>`).join("")}</ol>`;
      if (q.k === "tf") body += `<ul class="opts">${q.items.map((o) => `<li>${esc(o)}</li>`).join("")}</ul>`;
      if (q.k === "match") body += `<div class="mt"><ul>${q.left.map((o) => `<li>${esc(o)}</li>`).join("")}</ul><ul>${q.right.map((o) => `<li>${esc(o)}</li>`).join("")}</ul></div>`;
      const ms = q.ms ? `<ul class="ms">${q.ms.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>` : "";
      return `<div class="qa" role="button" tabindex="0" data-qa><span class="lv">${kind[q.k]} · ${q.marks} mark${q.marks > 1 ? "s" : ""}</span>${body}<div class="aa">${esc(q.a)}${ms}</div></div>`;
    }).join("");
    const mins = Math.round((st.timer || 300) / 60);
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.sub, rail: "Questions",
      actions: `<button class="tb" data-act="timer" data-sec="${st.timer || 300}">${mins}-minute timer</button>`,
      body: `<div class="inner">${cards}</div>`,
      drawers: [{ id: "tips", label: st.tipsTitle, title: st.tipsTitle, html: () => ideas(st.tips) }],
    };
  },
  assess(st) {
    return { raw: `<section class="pane wide assess"><h2>${esc(st.title)}</h2><p class="sub">${esc(st.sub || "")}</p>` +
      `<div class="row">${st.presets.map((m) => `<button class="ghost primary big" data-act="timer" data-sec="${m * 60}">Start ${m} minutes</button>`).join("")}<button class="ghost big" data-act="tstop">Stop timer</button></div></section>`, drawers: [] };
  },
  spot(st) {
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.sub, rail: "Spot the irony",
      body: `<div class="inner">` + st.items.map((it, i) => `<div class="spotitem" role="button" tabindex="0" data-spot="${i}"><p class="sq">${esc(it.t)}</p><p class="sw" hidden>${esc(it.why)}</p></div>`).join("") +
        `<div class="row"><button class="ghost primary" data-act="spotcheck">Check my answers</button><button class="ghost" data-act="spotreset">Start again</button></div><p class="score" id="spotscore"></p></div>`,
      drawers: [{ id: "tips", label: st.tipsTitle, title: st.tipsTitle, html: () => ideas(st.tips) }],
    };
  },
  battle(st) {
    const B = S.battle, R = st.rounds, done = B.r >= R.length;
    let body;
    if (done) {
      body = `<div class="bcard"><p class="score">${B.meter >= 100 ? "Macbeth is settled." : "Macbeth is nearly convinced."}</p><p class="hres">${esc(st.end)}</p><button class="ghost primary" data-act="brestart">Play again</button></div>`;
    } else {
      const rd = R[B.r], p = B.picked;
      body = `<div class="bcard"><span class="lab">Round ${B.r + 1} of ${R.length}: Macbeth says</span><p class="q">${esc(rd.doubt)}</p><span class="lab">Lady Macbeth: choose your tactic</span>` +
        rd.opts.map((o, i) => `<button class="opt${p !== null ? (o.best ? " right" : i === p ? " wrong" : "") : ""}" data-bopt="${i}" ${p !== null ? "disabled" : ""}>${String.fromCharCode(65 + i)}&nbsp; ${esc(o.t)}</button>`).join("") +
        (p !== null ? `<p class="hres"><b>${rd.opts[p].best ? "Strong choice." : "Not quite."}</b> ${esc(rd.opts[p].why)}</p><button class="ghost primary" data-act="bnext">${B.r + 1 === R.length ? "See the result" : "Next round"}</button>` : "") + `</div>`;
    }
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.sub, rail: "Battle",
      headExtra: `<div class="mhead"><span>Macbeth’s resolve</span><div class="meter" role="img" aria-label="Macbeth’s resolve ${B.meter} percent"><div class="bar" style="width:${B.meter}%"></div></div><b>${B.meter}%</b></div>`,
      body: `<div class="inner">${body}</div>`,
      drawers: [{ id: "quote", label: "Use a quotation", title: "Use a quotation", html: () => `<div class="idea"><b>Use a quotation</b><p>Every strong tactic comes from a line in the extract. Say which line you would quote.</p></div>` }],
    };
  },
};

/* ---------- putting a step on screen ---------- */
function mainMarkup(v) {
  if (v.raw) return v.raw;
  const btns = v.drawers.map((d) => `<button class="tb${d.cta ? " cta" : ""}" data-drawer="${d.id}" aria-pressed="false">${esc(typeof d.label === "function" ? d.label() : d.label)}</button>`).join("");
  const focus = v.focus ? `<button class="tb" data-act="focus" title="Show only the extract (F)"><i class="ic ic-focus"></i>Focus</button>` : "";
  return `<section class="pane main" id="mainpane"><div class="phead"><div class="pt"><span class="kick">${esc(v.kick)}</span><h2>${esc(v.title)}</h2>${v.sub ? `<p class="sub">${esc(v.sub)}</p>` : ""}</div>` +
    `<div class="ptools">${btns}${v.actions || ""}${focus}</div>${v.headExtra || ""}</div><div class="pbody" id="script">${v.body}</div></section>`;
}
const drawerMarkup = () =>
  `<aside class="pane drawer" id="drawer" hidden aria-label="Side panel"><div class="dhead"><h3 id="dtitle"></h3><div class="dtools">` +
  `<button class="tb" data-act="dwide" title="Make this panel wider or narrower"><i class="ic ic-wide"></i><span id="lw">Wider</span></button>` +
  `<button class="tb" data-act="dfull" title="Hide the main pane to use the full width"><i class="ic ic-full"></i><span id="lf">Hide</span></button>` +
  `<button class="ib" data-act="dclose" aria-label="Close" title="Close (Esc)"><i class="ic ic-close"></i></button></div></div><div class="dbody" id="panel" aria-live="polite"></div></aside>` +
  `<button class="railtab" id="mainrail" data-act="showmain" hidden></button>`;

function mount(keep) {
  const el = $("#stage");
  const st = cur();
  const v = VIEW[st.type](st);
  DR = {}; v.drawers.forEach((d) => (DR[d.id] = d));
  const keepTop = keep && $("#script") ? $("#script").scrollTop : 0;
  if (!keep) { S.drawer = null; S.wide = false; S.mainHidden = false; S.sel = null; }
  el.innerHTML = mainMarkup(v) + drawerMarkup();
  S.rail = (v.rail || "main pane").toLowerCase();
  const rail = $("#mainrail"); if (rail) rail.textContent = "Show " + S.rail;
  if (S.drawer && S.drawer !== "note" && !DR[S.drawer]) S.drawer = null;
  if (S.drawer === "note" && !S.sel) S.drawer = null;
  layout();
  if (S.sel) markSel();
  const sc = $("#script"); if (sc) sc.scrollTop = keepTop;
}
function markSel() { document.querySelectorAll("[data-note]").forEach((el) => el.classList.toggle("on", el.dataset.note === S.sel)); }
function layout() {
  const c = $("#stage"), d = $("#drawer");
  const has = !!S.drawer && !!d;
  c.classList.toggle("has-drawer", has);
  c.classList.toggle("wide", has && S.wide);
  c.classList.toggle("mainhidden", has && S.mainHidden);
  if (d) d.hidden = !has;
  const rail = $("#mainrail"); if (rail) rail.hidden = !(has && S.mainHidden);
  document.querySelectorAll(".tb[data-drawer]").forEach((b) => { const on = b.dataset.drawer === S.drawer; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
  if (has) { fillDrawer(); $("#lw").textContent = S.wide ? "Narrower" : "Wider"; $("#lf").textContent = (S.mainHidden ? "Show " : "Hide ") + S.rail; }
}
function fillDrawer() {
  const st = cur();
  let title, html;
  if (S.drawer === "note") {
    const n = S.sel && byId(st, S.sel);
    if (!n) { closeDrawer(); return; }
    title = "Notes"; html = notePanel(st, n);
  } else { const dd = DR[S.drawer]; title = dd.title || (typeof dd.label === "string" ? dd.label : ""); html = dd.html(); }
  $("#dtitle").textContent = title;
  $("#panel").innerHTML = html;
  $("#panel").scrollTop = 0;
}
function openDrawer(id) { S.drawer = id; layout(); }
function closeDrawer() {
  if (S.drawer === "note") S.sel = null;
  S.drawer = null; S.wide = false; S.mainHidden = false; markSel(); layout();
}
function select(id) {
  S.sel = id; S.drawer = "note"; markSel(); layout();
  const first = document.querySelector(`[data-note="${id}"]`);
  if (first) setTimeout(() => first.scrollIntoView({ block: "center", behavior: reduced() ? "auto" : "smooth" }), 40);
}
function stepNote(d) {
  const st = cur(), vis = visible(st);
  if (!vis.length) return;
  let i = vis.findIndex((n) => n.id === S.sel);
  i = i < 0 ? (d > 0 ? 0 : vis.length - 1) : (i + d + vis.length) % vis.length;
  select(vis[i].id);
}
function setFocus(on) {
  if (on && cur().type !== "extract") return;
  S.focus = on;
  document.body.classList.toggle("focus", on);
  $("#fctl").setAttribute("aria-hidden", String(!on));
  if (on) setTimeout(() => $("#unfocus").focus({ preventScroll: true }), 400);
  const sc = $("#script"); if (sc && on) sc.scrollTop = sc.scrollTop;
}

/* ---------- spot the irony ---------- */
function spotCheck() {
  const st = cur(), total = st.items.filter((i) => i.irony).length;
  let hit = 0, wrong = 0;
  document.querySelectorAll(".spotitem").forEach((el) => {
    const it = st.items[+el.dataset.spot], picked = el.classList.contains("picked");
    el.classList.remove("ok", "bad", "miss", "none");
    if (picked && it.irony) { el.classList.add("ok"); hit++; }
    else if (picked) { el.classList.add("bad"); wrong++; }
    else if (it.irony) el.classList.add("miss");
    else el.classList.add("none");
    el.querySelector(".sw").hidden = false;
  });
  $("#spotscore").textContent = `You found ${hit} of ${total} ironic lines` + (wrong ? ` and picked ${wrong} that ${wrong === 1 ? "is" : "are"} not dramatic irony.` : ".");
}

/* ---------- navigation ---------- */
function renderAll() { renderTop(); renderNav(); renderFilters(); mount(false); }
function go(h, s) {
  if (S.focus) setFocus(false);
  S.h = h; S.s = s; S.sel = null; S.battle = { r: 0, meter: 20, picked: null };
  renderAll();
}
function move(d) {
  let h = S.h, s = S.s + d;
  if (s < 0) { if (h === 0) return; h--; s = DATA.hours[h].steps.length - 1; }
  else if (s >= DATA.hours[h].steps.length) { if (h === DATA.hours.length - 1) return; h++; s = 0; }
  go(h, s);
}

/* ---------- timer ---------- */
const T = { id: null, end: 0 };
const mmss = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function timerStart(sec) {
  clearInterval(T.id);
  const el = $("#timer"); el.hidden = false; el.classList.remove("done");
  T.end = Date.now() + sec * 1000;
  const tick = () => {
    const left = Math.max(0, Math.ceil((T.end - Date.now()) / 1000));
    $("#tt").textContent = left > 0 ? mmss(left) : "Time!";
    if (left <= 0) { clearInterval(T.id); el.classList.add("done"); }
  };
  tick(); T.id = setInterval(tick, 250);
}
function timerStop() { clearInterval(T.id); $("#timer").hidden = true; }

/* ---------- events ---------- */
function syncReveal(scope) {
  const btn = (scope || document).querySelector('[data-act="reveal"],[data-act="revealcard"]');
  if (!btn) return;
  const gaps = [...(scope || document).querySelectorAll(".gap")];
  btn.textContent = gaps.length && gaps.every((g) => g.classList.contains("open")) ? "Hide all" : "Reveal all";
}
function hingeMark(box, hg, picked) {
  box.querySelectorAll(".opt").forEach((o, j) => { o.classList.toggle("right", j === hg.correct); o.classList.toggle("wrong", picked !== null && j === picked && j !== hg.correct); });
  const res = box.querySelector(".hres"); res.hidden = false;
  res.innerHTML = `<b>${picked === null ? "Answer:" : picked === hg.correct ? "Correct." : "Not quite."}</b> ${esc(hg.why)}`;
}
function hidePops() {
  document.querySelectorAll(".pop").forEach((p) => { p.hidden = true; const b = p.parentElement.querySelector("button[aria-haspopup]"); if (b) b.setAttribute("aria-expanded", "false"); });
}
document.addEventListener("click", (e) => {
  const t = e.target;
  const pb = t.closest("button[aria-haspopup]");
  if (pb) {
    const p = pb.parentElement.querySelector(".pop"), wasHidden = p.hidden;
    hidePops(); p.hidden = !wasHidden; pb.setAttribute("aria-expanded", String(wasHidden));
    return;
  }
  if (!t.closest(".pop")) hidePops();
  const dr = t.closest("[data-drawer]");
  if (dr) {
    const id = dr.dataset.drawer;
    if (S.drawer === id) closeDrawer();
    else if (id === "note") { if (S.sel && visible(cur()).some((n) => n.id === S.sel)) select(S.sel); else stepNote(1); }
    else { if (S.drawer === "note") S.sel = null; markSel(); openDrawer(id); }
    return;
  }
  const note = t.closest("[data-note]");
  if (note) { select(note.dataset.note); return; }
  const gap = t.closest("[data-gap]");
  if (gap) { gap.classList.toggle("open"); syncReveal(gap.closest(".gapcard") || document); return; }
  const qa = t.closest("[data-qa]");
  if (qa) { qa.classList.toggle("open"); return; }
  const fact = t.closest("[data-reveal]");
  if (fact) { fact.classList.toggle("open"); return; }
  const sp = t.closest("[data-spot]");
  if (sp) { if (!/\b(ok|bad|miss|none)\b/.test(sp.className)) sp.classList.toggle("picked"); return; }
  const bo = t.closest("[data-bopt]");
  if (bo) {
    const B = S.battle, rd = cur().rounds[B.r];
    if (B.picked === null) { B.picked = +bo.dataset.bopt; B.meter = Math.min(100, B.meter + rd.opts[B.picked].pts); mount(true); }
    return;
  }
  const hb = t.closest("[data-hinge]");
  if (hb) { hingeMark(hb.closest(".hinge"), cur().hinge, +hb.dataset.hinge); return; }
  const rate = t.closest("[data-rate]");
  if (rate) {
    const [h, i, v] = rate.dataset.rate.split(":");
    S.rate[h + ":" + i] = +v; saveRate();
    const box = rate.closest("#ratings, .ratings-h");
    if (box) box.innerHTML = ratingHTML(+h);
    return;
  }
  const b = t.closest("button");
  if (!b) return;
  if (b.closest("#tmenu")) { timerStart(+b.dataset.sec); hidePops(); return; }
  if (b.dataset.h !== undefined) { hidePops(); return go(+b.dataset.h, 0); }
  if (b.dataset.s !== undefined) return go(S.h, +b.dataset.s);
  if (b.dataset.tag !== undefined) {
    S.tag = b.dataset.tag;
    const st = cur();
    if (S.sel && !match(byId(st, S.sel))) { S.sel = null; if (S.drawer === "note") S.drawer = null; }
    renderFilters(); mount(true);
    return;
  }
  switch (b.dataset.act) {
    case "next": move(1); break;
    case "prev": move(-1); break;
    case "nn": stepNote(1); break;
    case "pn": stepNote(-1); break;
    case "firstnote": stepNote(1); break;
    case "dclose": closeDrawer(); break;
    case "dwide": S.wide = !S.wide; S.mainHidden = false; layout(); break;
    case "dfull": S.mainHidden = !S.mainHidden; layout(); break;
    case "showmain": S.mainHidden = false; layout(); break;
    case "focus": setFocus(true); break;
    case "unfocus": setFocus(false); break;
    case "tog": { const el = $("#panel ." + b.dataset.t); if (el) { el.hidden = !el.hidden; if (!el.hidden) el.scrollIntoView({ block: "nearest" }); } break; }
    case "timer": timerStart(+b.dataset.sec); break;
    case "spotcheck": spotCheck(); break;
    case "spotreset": mount(true); break;
    case "bnext": S.battle.r++; S.battle.picked = null; mount(true); break;
    case "brestart": S.battle = { r: 0, meter: 20, picked: null }; mount(true); break;
    case "tstop": timerStop(); break;
    case "hingeshow": hingeMark(b.closest(".hinge"), cur().hinge, null); break;
    case "reveal": case "revealcard": {
      const scope = b.closest(".gapcard") || document;
      const gaps = scope.querySelectorAll(".gap");
      const allOpen = [...gaps].every((g) => g.classList.contains("open"));
      gaps.forEach((g) => g.classList.toggle("open", !allOpen));
      syncReveal(scope);
      break;
    }
  }
});
document.addEventListener("keydown", (e) => {
  const tg = e.target instanceof Element ? e.target : document.body;
  if ((e.key === "Enter" || e.key === " ") && tg.matches("[role=button]")) { e.preventDefault(); tg.click(); return; }
  if (tg.matches("input,textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Escape") {
    if ([...document.querySelectorAll(".pop")].some((p) => !p.hidden)) hidePops();
    else if (S.focus) setFocus(false);
    else if (S.drawer) closeDrawer();
    return;
  }
  if (e.key === "f" || e.key === "F") { setFocus(!S.focus); return; }
  if (S.focus) return;
  if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "]") stepNote(1);
  else if (e.key === "[") stepNote(-1);
});

/* tools */
function setScale(d) {
  S.scale = Math.min(1.6, Math.max(0.75, +(S.scale + d).toFixed(2)));
  document.documentElement.style.setProperty("--scale", S.scale);
}
["#fsm", "#ffm"].forEach((id) => $(id).addEventListener("click", () => setScale(-0.1)));
["#fsp", "#ffp"].forEach((id) => $(id).addEventListener("click", () => setScale(0.1)));
function effectiveTheme() { return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function syncTheme() { $("#theme").textContent = effectiveTheme() === "dark" ? "Day mode" : "Night mode"; }
$("#theme").addEventListener("click", () => { document.documentElement.dataset.theme = effectiveTheme() === "dark" ? "light" : "dark"; syncTheme(); });
$("#full").addEventListener("click", () => {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (err) { /* not available */ }
});
syncTheme();
renderAll();
</script>
</body>
</html>
