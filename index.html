"mins": 15, "label": "Extract 11", "title": "Act 2, Scene 1: Macbeth’s soliloquy", "sub": "The dagger speech", "scene": "2.1", "setup": "Macbeth is alone on stage for the first time since deciding to murder Duncan. This whole speech is a soliloquy: no other character can hear it. Listen for where he argues with himself, and where he finally decides to act.", "think": "With a partner (30 seconds): does Macbeth sound more frightened or more determined by the end of the speech?", "thinkSecs": 30, "task": "Underline the line where Macbeth first doubts that the dagger is real. Circle the line where he decides to go through with the murder.", "lines": [{"k": "sp", "t": "Macbeth"}, {"k": "ln", "n": 44, "t": "Is this a dagger which I see before me,"}, {"k": "ln", "n": 45, "t": "The handle toward my hand? Come, let me clutch"}, {"k": "ln", "n": 46, "t": "thee."}, {"k": "ln", "n": 47, "t": "I have thee not, and yet I see thee still."}, {"k": "ln", "n": 48, "t": "Art thou not, fatal vision, sensible"}, {"k": "ln", "n": 49, "t": "To feeling as to sight? Or art thou but"}, {"k": "ln", "n": 50, "t": "A dagger of the mind, a false creation"}, {"k": "ln", "n": 51, "t": "Proceeding from the heat-oppressèd brain?"}, {"k": "ln", "n": 52, "t": "I see thee yet, in form as palpable"}, {"k": "ln", "n": 53, "t": "As this which now I draw."}, {"k": "st", "t": "He draws his dagger.", "key": "s53"}, {"k": "ln", "n": 54, "t": "Thou marshal’st me the way that I was going,"}, {"k": "ln", "n": 55, "t": "And such an instrument I was to use."}, {"k": "ln", "n": 56, "t": "Mine eyes are made the fools o’ th’ other senses"}, {"k": "ln", "n": 57, "t": "Or else worth all the rest. I see thee still,"}, {"k": "ln", "n": 58, "t": "And, on thy blade and dudgeon, gouts of blood,"}, {"k": "ln", "n": 59, "t": "Which was not so before. There’s no such thing."}, {"k": "ln", "n": 60, "t": "It is the bloody business which informs"}, {"k": "ln", "n": 61, "t": "Thus to mine eyes. Now o’er the one-half world"}, {"k": "gap", "t": "[…Macbeth describes the sleeping world, witchcraft, and withered murder stealing towards its victim like a wolf…]"}, {"k": "ln", "n": 69, "t": "Moves like a ghost. Thou sure and firm-set earth,"}, {"k": "ln", "n": 70, "t": "Hear not my steps, which way they walk, for fear"}, {"k": "ln", "n": 71, "t": "Thy very stones prate of my whereabouts"}, {"k": "ln", "n": 72, "t": "And take the present horror from the time,"}, {"k": "ln", "n": 73, "t": "Which now suits with it. Whiles I threat, he lives."}, {"k": "ln", "n": 74, "t": "Words to the heat of deeds too cold breath gives."}, {"k": "st", "t": "A bell rings.", "key": "s74"}, {"k": "ln", "n": 75, "t": "I go, and it is done. The bell invites me."}, {"k": "ln", "n": 76, "t": "Hear it not, Duncan, for it is a knell"}, {"k": "ln", "n": 77, "t": "That summons thee to heaven or to hell."}, {"k": "st", "t": "He exits.", "key": "s77"}], "notes": [{"id": "a2n11-1", "at": 44, "phrase": "Is this a dagger which I see before me,", "title": "The soliloquy begins", "meaning": "Macbeth is alone on stage and speaks his private thoughts aloud. No other character can hear him: this whole speech is a soliloquy, today’s word.", "effect": "Shakespeare lets us hear Macbeth’s mind working in real time, rather than simply showing us the murder. We watch him decide, rather than just seeing what he decides.", "ask": "Why might Shakespeare want the audience to hear this, rather than just showing us the murder itself?", "tags": ["language"]}, {"id": "a2n11-2", "at": 47, "phrase": "I have thee not, and yet I see thee still.", "title": "Another paradox", "meaning": "Macbeth cannot touch the dagger, and yet he can still see it clearly: two things that shouldn’t both be true at once.", "effect": "This echoes Act 1’s paradoxes (“fair is foul”, “nothing is but what is not”). But this confusion is now happening entirely inside Macbeth’s own head, not from an outside voice.", "ask": "How is this different from the paradoxes the witches spoke in Act 1?", "tags": ["language", "ahead"]}, {"id": "a2n11-3", "from": 48, "to": 51, "title": "Is it real?", "meaning": "Macbeth asks whether the dagger can be felt as well as seen, or whether it is only “a dagger of the mind”, created by his overheated (“heat-oppressèd”) brain.", "effect": "He argues with himself exactly as he did in Act 1 Scene 3 (“cannot be ill, cannot be good”): reasoning out loud instead of simply acting.", "ask": "Does it matter whether the dagger is real, if Macbeth has already decided what to do?", "tags": ["ambition", "language"]}, {"id": "a2n11-4", "at": 54, "phrase": "Thou marshal’st me the way that I was going,", "title": "Leading him on", "meaning": "“Marshal’st” means leads or guides, like a marshal directing troops. The vision doesn’t send Macbeth anywhere new: it only points him towards the murder he had already decided on.", "effect": "This matters for tracking Macbeth’s ambition: his own mind produces this vision. Nothing supernatural is making him kill Duncan.", "ask": "Is Macbeth being led by something outside himself, or by his own ambition?", "tags": ["ambition", "peel"]}, {"id": "a2n11-5", "at": 55, "phrase": "And such an instrument I was to use.", "title": "His own instrument", "meaning": "Macbeth admits the dagger he imagines is the same kind of weapon (“instrument”) he was already planning to use.", "effect": "Compare this with Banquo’s Act 1 warning about the “instruments of darkness”: there, evil forces used small truths to trap men. Here, Macbeth’s own desire has produced the instrument. The temptation is now entirely his own.", "ask": "In Act 1, who or what was the “instrument”? Who, or what, is the instrument now?", "tags": ["ambition", "ahead", "peel"]}, {"id": "a2n11-6", "from": 58, "to": 59, "title": "Blood appears", "meaning": "Fresh blood suddenly appears on the dagger’s blade and handle (“dudgeon”): blood that “was not so before”.", "effect": "This is the first time blood appears in the play as an image inside Macbeth’s own mind, before he has killed anyone. Watch for blood imagery spreading through next lesson’s scene.", "tags": ["language", "ahead", "guilt"]}, {"id": "a2n11-7", "from": 60, "to": 61, "title": "He explains it away — then the night itself seems to change", "meaning": "Macbeth decides the vision comes from the “bloody business” he is about to do, not from anything supernatural.", "effect": "He answers his own question: the dagger isn’t real, it is his guilt and intention showing itself. Straight after this, the speech turns into a description of the whole sleeping world, witchcraft and murder stalking like a wolf (skipped on the page): Macbeth’s language turns darker exactly as his resolve hardens.", "ask": "Why might Shakespeare have Macbeth imagine the whole world turning dark, rather than just thinking about Duncan?", "tags": ["appearance", "guilt", "ahead"]}, {"id": "a2n11-8", "from": 70, "to": 71, "title": "Even the earth might betray him", "meaning": "Macbeth asks the ground itself not to let his footsteps be heard, in case the very stones “prate” (chatter, gossip) about where he is.", "effect": "He is now imagining that even inanimate objects could betray his secret. This nervous, guilty imagination continues the “horrid image” pattern from Act 1 — and will grow far worse next lesson.", "ask": "What does it suggest about Macbeth’s state of mind that he imagines stones being able to talk?", "tags": ["guilt", "language", "ahead"]}, {"id": "a2n11-9", "from": 73, "to": 74, "title": "Enough talking", "meaning": "While Macbeth only threatens Duncan with words, Duncan stays alive. Talking is too cold and slow for an act this urgent (“hot”).", "effect": "He tells himself to stop reasoning and start acting: the turning point from thought to deed.", "ask": "Compare this with “I am settled” at the end of Act 1. What has changed, and what hasn’t?", "tags": ["ambition", "peel"]}, {"id": "a2n11-10", "at": 75, "phrase": "I go, and it is done. The bell invites me.", "title": "The bell as an invitation", "meaning": "The bell, which Lady Macbeth rings as the agreed signal, is described as inviting him, like a welcome guest.", "effect": "Notice how he treats the signal to murder as something pleasant (“invites”). Compare this with the very next lines, where the same bell becomes a funeral bell.", "tags": ["language", "guilt"]}, {"id": "a2n11-11", "from": 76, "to": 77, "title": "A funeral bell for a living man", "meaning": "A “knell” is the sound of a bell rung to announce a death. Macbeth calls the bell a knell for Duncan, who is still alive, summoning him “to heaven or to hell”.", "effect": "This rhyming couplet ends the soliloquy like a spell or a verdict, echoing “fair is foul” and “false face must hide”. Macbeth speaks as though the murder has already happened.", "ask": "Why might Shakespeare end the speech with a rhyming couplet, as he did at the end of Act 1 Scene 7?", "tags": ["language", "ahead", "guilt"]}], "gloss": [["dudgeon", "the wooden handle of a dagger"], ["palpable", "solid enough to touch"], ["heat-oppressèd", "overheated, feverish"], ["marshal’st", "leads, guides (like a marshal directing troops)"], ["sentinel", "a guard, a lookout"], ["prate", "chatter, gossip"], ["knell", "the sound of a bell rung to announce a death"]]}, {"type": "plenary", "key": "a2h1-end", "short": "Exit", "mins": 6, "title": "Exit ticket", "ticket": [{"q": "Find one phrase from the soliloquy that shows Macbeth’s fear or hesitation.", "a": "For example “Hear not my steps… for fear”, or “I have thee not, and yet I see thee still” — any phrase showing doubt or fear is acceptable."}, {"q": "In Act 1, Lady Macbeth said Macbeth was “too full o’ th’ milk of human kindness” to murder. Does this soliloquy support or challenge her judgement of him?", "a": "It mostly challenges it: although he hesitates and argues with himself, he still goes through with the murder by the end of the speech (“I go, and it is done”), showing he is capable of what she doubted."}, {"q": "Ambition tracker: what does Macbeth want at this point, and what is stopping him from going straight to get it?", "a": "He wants to be king and is ready to murder Duncan to get there. What holds him back is his own fear and guilt, not any outside force: notice how the vision pushing him forward comes from his own mind."}], "next": "Next lesson: we go downstairs with Lady Macbeth, straight after the murder, to see who stays in control."}], "aims": {"li": "To explore Macbeth’s dagger soliloquy, and to understand what a soliloquy is and why Shakespeare uses one here.", "sc": ["I can explain what a soliloquy is.", "I can find a phrase in the soliloquy that shows Macbeth’s fear or hesitation.", "I can explain what the dagger vision suggests about where Macbeth’s ambition is coming from."], "word": {"w": "soliloquy", "m": "a speech in which a character speaks their thoughts, alone on stage.", "eg": "Macbeth’s dagger speech is a soliloquy: no one else can hear his private thoughts. Use the word in one sentence today."}, "bridge": "In your Case File you reviewed how Lady Macbeth sees Macbeth’s character before the murder. Tonight, in this scene, Macbeth is alone for the first time since deciding to kill Duncan."}}, {"title": "Act 2, Lesson 2", "subtitle": "Scene 2.2: after the murder", "steps": [{"type": "aims", "key": "a2h2-aims", "short": "Aims", "mins": 5, "title": "Today’s lesson", "doNow": {"title": "Do now: what do you remember?", "qa": [{"q": "What did Macbeth see and argue with, alone on stage last lesson?", "a": "A vision of a dagger, which he decided was “a dagger of the mind” created by his own guilty thoughts."}, {"q": "What signal was Macbeth waiting for before he went to Duncan’s room?", "a": "Lady Macbeth ringing a bell."}, {"q": "What is a soliloquy?", "a": "A speech where a character shares their private thoughts alone on stage."}]}}, {"type": "link", "key": "a2l2", "short": "What’s happening", "mins": 4, "title": "Downstairs, moments later", "text": "Downstairs, Lady Macbeth feels bold because she has drunk the same wine that made Duncan’s {{guards}} fall asleep, and she has left the {{daggers}} ready for Macbeth. When Macbeth returns, badly shaken, he says he has done the {{deed}}. He describes hearing two of the sleeping men wake, say their prayers, and go back to sleep — he could not say ‘{{Amen}}’ with them. He then says he heard a voice cry that he had murdered {{sleep}} itself, and that he will ‘sleep no more’."}, {"type": "extract", "key": "a2e12", "short": "2.2 Control", "mins": 15, "label": "Extract 12", "title": "Act 2, Scene 2: Lady Macbeth takes control", "sub": "Straight after the murder", "scene": "2.2", "setup": "Lady Macbeth is waiting downstairs when Macbeth returns, shaken, with the murder weapons still in his hands. Watch how differently each of them speaks.", "think": "With a partner (30 seconds): find one word or phrase that shows Lady Macbeth is still in control.", "thinkSecs": 30, "task": "Underline one thing Lady Macbeth says that shows she is in control. Circle one thing Macbeth says that shows he has lost his composure.", "lines": [{"k": "sp", "t": "Lady Macbeth"}, {"k": "ln", "n": 58, "t": "Who was it that thus cried? Why, worthy thane,"}, {"k": "ln", "n": 59, "t": "You do unbend your noble strength to think"}, {"k": "ln", "n": 60, "t": "So brainsickly of things. Go get some water"}, {"k": "ln", "n": 61, "t": "And wash this filthy witness from your hand.—"}, {"k": "ln", "n": 62, "t": "Why did you bring these daggers from the place?"}, {"k": "ln", "n": 63, "t": "They must lie there. Go, carry them and smear"}, {"k": "ln", "n": 64, "t": "The sleepy grooms with blood."}, {"k": "sp", "t": "Macbeth"}, {"k": "ln", "n": 65, "t": "I’ll go no more."}, {"k": "ln", "n": 66, "t": "I am afraid to think what I have done."}, {"k": "ln", "n": 67, "t": "Look on ’t again I dare not."}, {"k": "sp", "t": "Lady Macbeth"}, {"k": "ln", "n": 68, "t": "Infirm of purpose!"}, {"k": "ln", "n": 69, "t": "Give me the daggers. The sleeping and the dead"}, {"k": "ln", "n": 70, "t": "Are but as pictures. ’Tis the eye of childhood"}, {"k": "ln", "n": 71, "t": "That fears a painted devil. If he do bleed,"}, {"k": "ln", "n": 72, "t": "I’ll gild the faces of the grooms withal,"}, {"k": "ln", "n": 73, "t": "For it must seem their guilt."}, {"k": "st", "t": "She exits with the daggers. Knock within.", "key": "s73"}], "notes": [{"id": "a2n12-1", "from": 58, "to": 60, "title": "Calm and in control", "meaning": "Lady Macbeth calmly asks who cried out, then tells Macbeth he is “unbending his noble strength” by thinking so “brainsickly” (in a sick, confused way) about what has happened.", "effect": "While Macbeth is falling apart, she stays composed, even flattering him (“worthy thane”) while correcting him. This is the clearest evidence yet of the contrast between them.", "ask": "How does calling him “worthy thane” while criticising him make her seem more, not less, in control?", "tags": ["lady", "peel"]}, {"id": "a2n12-2", "from": 61, "to": 64, "title": "Practical instructions", "meaning": "She gives Macbeth a string of practical, physical tasks: wash his hands, return the daggers, smear the sleeping guards with blood to frame them.", "effect": "Notice the short, direct commands. She thinks in actions and solutions while Macbeth is frozen by what he has done. This is a strong quotation for showing her taking control.", "tags": ["lady", "peel"]}, {"id": "a2n12-3", "from": 65, "to": 67, "title": "Macbeth freezes", "meaning": "Macbeth refuses to go back with the daggers, admits he is afraid even to think about what he has done, and says he dares not look at it again.", "effect": "Compare this with the dagger soliloquy: there he argued and reasoned before acting; here he can barely manage full sentences. His confidence has collapsed.", "ask": "Last lesson Macbeth said “I go, and it is done.” How has his tone changed now that it actually is done?", "tags": ["ambition", "guilt", "ahead"]}, {"id": "a2n12-4", "at": 68, "phrase": "Infirm of purpose!", "title": "Word to know: foil", "meaning": "“Infirm of purpose” means weak-willed, unable to follow through. Lady Macbeth snaps this at Macbeth in frustration.", "effect": "This short, sharp line shows her impatience with his hesitation. Shakespeare places two opposite characters side by side here: her hard decisiveness against his guilt-stricken hesitation. That contrast is what a foil is — today’s word.", "tags": ["lady", "language", "peel"]}, {"id": "a2n12-5", "from": 69, "to": 71, "title": "The sleeping and the dead are “pictures”", "meaning": "She says the sleeping and the dead look the same, “but as pictures”, and only a child (“the eye of childhood”) would be frightened by a painted image of the devil.", "effect": "She reduces murder to something almost harmless, an image rather than a real horror. This tells us how she is managing her own fear, not necessarily that she feels none.", "ask": "Is Lady Macbeth genuinely fearless here, or is she talking herself into it, the way Macbeth did in his soliloquy?", "tags": ["lady", "appearance", "peel"]}, {"id": "a2n12-6", "from": 72, "to": 73, "title": "Gild and guilt", "meaning": "“Gild” means to cover with a gold colour: here, she means smearing the grooms’ faces with blood so that they look guilty.", "effect": "“Gild” and “guilt” sound alike and sit close together, linking the idea of covering something up with the crime itself. This is the “false face” trick from Act 1 Scene 7, now put into action.", "ask": "Where else in the play has “hiding the truth behind a surface” appeared before?", "tags": ["lady", "language", "appearance", "ahead"]}], "gloss": [["unbend", "relax, let go of"], ["brainsickly", "in a sick, confused way"], ["witness", "evidence, proof (here: the blood)"], ["infirm of purpose", "weak-willed, unable to follow through"], ["gild", "cover with a gold colour"], ["withal", "with it, as well"]]}, {"type": "link", "key": "a2l3", "short": "What’s happening", "mins": 3, "title": "The knocking begins", "text": "Someone begins knocking loudly at the gate. Macbeth stares at his bloody hands and imagines that the whole ocean could not wash them {{clean}}; he says the sea itself would turn red instead. Lady Macbeth tells him a little {{water}} is all it takes, and hurries him away to change before the knocking is answered.", "hinge": {"q": "What does Macbeth mean when he says the ocean could not wash the blood from his hand?", "opts": ["The blood is a strange colour.", "His guilt feels too great to ever be washed away.", "He wants to go swimming.", "The water in the castle is dirty."], "correct": 1, "why": "Macbeth imagines the opposite happening — the sea turning red from his hand, not his hand becoming clean. His guilt feels permanent, however much water is used."}}, {"type": "plenary", "key": "a2h2-end", "short": "Exit", "mins": 7, "title": "Exit ticket", "ticket": [{"q": "Find a quotation in the extract that shows Lady Macbeth staying calm and in control.", "a": "For example “Infirm of purpose! / Give me the daggers” or “A little water clears us of this deed.”"}, {"q": "Explain what “’Tis the eye of childhood / That fears a painted devil” suggests about how Lady Macbeth sees fear.", "a": "She compares fear of what you’ve done to a child’s fear of a painted (fake) devil: not real danger, just an image. It suggests she believes guilt and fear are something you can simply choose to ignore."}, {"q": "Ambition tracker: compare Macbeth’s “I am afraid to think what I have done” with his “I go, and it is done” from last lesson. What has changed?", "a": "Before the murder he pushed himself forward with resolve; now that it is done, his confidence has collapsed into guilt and fear. Keep this contrast for comparing him with the very different man we meet in Act 3."}, {"q": "Case File: add one new piece of evidence to your Lady Macbeth Case File from today’s scene.", "a": "Any moment showing her decisiveness, calmness, or control — for example “Infirm of purpose!” or her plan to gild the grooms’ faces with blood."}], "next": "Next lesson: we build the skills for a PEEL paragraph about Lady Macbeth, using the evidence you’ve collected across both lessons."}], "aims": {"li": "To explore how Lady Macbeth manages Macbeth immediately after the murder, and to understand what a foil is.", "sc": ["I can find a quotation showing Lady Macbeth staying calm and in control.", "I can explain what “foil” means and identify how Macbeth and Lady Macbeth act as foils for each other in this scene.", "I can choose the strongest quotation from this scene for a PEEL paragraph about Lady Macbeth."], "word": {"w": "foil", "m": "a character whose traits contrast with another’s, making both characters’ traits stand out.", "eg": "Lady Macbeth’s calm control makes Macbeth’s panic even more obvious, and the other way round. Use the word in one sentence today."}, "bridge": "Last lesson, Macbeth argued with a vision of a dagger, then went to murder Duncan. This scene picks up moments later, downstairs, where Lady Macbeth is waiting."}}, {"title": "Act 2, Lesson 4", "subtitle": "Scene 2.3: the discovery", "steps": [{"type": "aims", "key": "a2h4-aims", "short": "Aims", "mins": 5, "title": "Today’s lesson", "doNow": {"title": "Do now: what do you remember?", "qa": [{"q": "At the end of Scene 2.2, what sound interrupted Macbeth and Lady Macbeth?", "a": "A knocking at the south gate of the castle."}, {"q": "How did Macbeth sound at the end of Scene 2.2: confident or frightened? Use a quotation.", "a": "Frightened and guilty, for example “I am afraid to think what I have done” or “To know my deed ’twere best not know myself.”"}, {"q": "What is a foil?", "a": "A character whose traits contrast with another’s, making both characters’ traits stand out."}]}}, {"type": "link", "key": "a2l4", "short": "What’s happening", "mins": 4, "title": "Morning at the castle", "text": "The knocking continues. A drunk {{Porter}} takes his time answering, joking that he is the porter of {{hell}} gate and letting in sinners: a farmer, a tailor and an equivocator (someone who uses words that sound true but hide the truth). At last he opens the door to Macduff and Lennox, who have come early to wake King {{Duncan}}. Macbeth comes down to meet them. Soon the whole castle will be woken by the alarm {{bell}}, because the King has been {{murdered}}.", "hinge": {"q": "Why might Shakespeare make the Porter pretend the castle is hell’s gate?", "opts": ["Because he is cold and wants to go back to bed", "Because Macbeth’s castle has become like hell now that a murder has happened inside it", "Because the Porter has met the witches", "Because Macduff is a sinner"], "correct": 1, "why": "The Porter’s joke is funny, but it also turns Macbeth’s castle into hell itself, a place where sinners are let in. Shakespeare lets us laugh for a moment before the body is found, which makes the horror sharper."}}, {"type": "extract", "key": "a2e13", "short": "2.3 Acting", "mins": 18, "label": "Extract 13", "title": "Act 2, Scene 3: Macbeth plays his part", "sub": "The morning after the murder", "scene": "2.3", "setup": "It is the morning after the murder. Macbeth must now face Macduff and Lennox, who have come to wake the King. Listen for how Macbeth speaks, and look for moments where the audience knows more than the characters on stage.", "think": "With a partner (30 seconds): how is Macbeth’s way of speaking different from the end of Scene 2.2?", "thinkSecs": 30, "task": "Underline one line where Macbeth stays calm and polite. Circle one phrase where Macbeth or Lady Macbeth says the opposite of what they really feel.", "lines": [{"k": "sp", "t": "Macduff"}, {"k": "ln", "n": 48, "t": "Is the King stirring, worthy thane?"}, {"k": "sp", "t": "Macbeth"}, {"k": "ln", "n": 49, "t": "Not yet."}, {"k": "sp", "t": "Macduff"}, {"k": "ln", "n": 50, "t": "He did command me to call timely on him."}, {"k": "ln", "n": 51, "t": "I have almost slipped the hour."}, {"k": "sp", "t": "Macbeth"}, {"k": "ln", "n": 52, "t": "I’ll bring you to him."}, {"k": "sp", "t": "Macduff"}, {"k": "ln", "n": 53, "t": "I know this is a joyful trouble to you,"}, {"k": "ln", "n": 54, "t": "But yet ’tis one."}, {"k": "sp", "t": "Macbeth"}, {"k": "ln", "n": 55, "t": "The labor we delight in physics pain."}, {"k": "ln", "n": 56, "t": "This is the door."}, {"k": "sp", "t": "Macduff"}, {"k": "ln", "n": 57, "t": "I’ll make so bold to call,"}, {"k": "ln", "n": 58, "t": "For ’tis my limited service."}, {"k": "st", "t": "Macduff exits.", "key": "s58"}, {"k": "gap", "t": "[…Lennox describes the night’s strange omens: chimneys blown down, screams of death heard in the air, the Earth itself shaking…]"}, {"k": "sp", "t": "Macbeth"}, {"k": "ln", "n": 70, "t": "’Twas a rough night."}, {"k": "st", "t": "Enter Macduff.", "key": "s72"}, {"k": "sp", "t": "Macduff"}, {"k": "ln", "n": 73, "t": "O horror, horror, horror!"}, {"k": "ln", "n": 74, "t": "Tongue nor heart cannot conceive nor name thee!"}, {"k": "gap", "t": "[…Macduff tells Macbeth and Lennox to go and see for themselves. They hurry off to Duncan’s chamber…]"}, {"k": "sp", "t": "Macduff"}, {"k": "ln", "n": 85, "t": "Awake, awake!"}, {"k": "ln", "n": 86, "t": "Ring the alarum bell.—Murder and treason!"}, {"k": "ln", "n": 87, "t": "Banquo and Donalbain, Malcolm, awake!"}, {"k": "ln", "n": 88, "t": "Shake off this downy sleep, death’s counterfeit,"}, {"k": "ln", "n": 89, "t": "And look on death itself. Up, up, and see"}, {"k": "ln", "n": 90, "t": "The great doom’s image. Malcolm, Banquo,"}, {"k": "gap", "t": "[…The alarm bell rings. Lady Macbeth enters…]"}, {"k": "sp", "t": "Lady Macbeth"}, {"k": "ln", "n": 93, "t": "What’s the business,"}, {"k": "ln", "n": 94, "t": "That such a hideous trumpet calls to parley"}, {"k": "ln", "n": 95, "t": "The sleepers of the house? Speak, speak!"}, {"k": "sp", "t": "Macduff"}, {"k": "ln", "n": 96, "t": "O gentle lady,"}, {"k": "ln", "n": 97, "t": "’Tis not for you to hear what I can speak."}, {"k": "ln", "n": 98, "t": "The repetition in a woman’s ear"}, {"k": "ln", "n": 99, "t": "Would murder as it fell."}, {"k": "st", "t": "Enter Banquo.", "key": "s99"}, {"k": "ln", "n": 100, "t": "O Banquo, Banquo,"}, {"k": "ln", "n": 101, "t": "Our royal master’s murdered."}, {"k": "sp", "t": "Lady Macbeth"}, {"k": "ln", "n": 102, "t": "Woe, alas!"}, {"k": "ln", "n": 103, "t": "What, in our house?"}, {"k": "sp", "t": "Banquo"}, {"k": "ln", "n": 104, "t": "Too cruel anywhere."}, {"k": "ln", "n": 105, "t": "Dear Duff, I prithee, contradict thyself"}, {"k": "ln", "n": 106, "t": "And say it is not so."}, {"k": "st", "t": "Enter Macbeth, Lennox, and Ross.", "key": "s106"}, {"k": "sp", "t": "Macbeth"}, {"k": "ln", "n": 107, "t": "Had I but died an hour before this chance,"}, {"k": "ln", "n": 108, "t": "I had lived a blessèd time; for from this instant"}, {"k": "ln", "n": 109, "t": "There’s nothing serious in mortality."}, {"k": "ln", "n": 110, "t": "All is but toys. Renown and grace is dead."}, {"k": "ln", "n": 111, "t": "The wine of life is drawn, and the mere lees"}, {"k": "ln", "n": 112, "t": "Is left this vault to brag of."}], "notes": [{"id": "a2n13-1", "at": 48, "phrase": "worthy thane", "title": "“Worthy thane”", "meaning": "“Thane” is the title of a Scottish lord. Macduff calls Macbeth “worthy”: honourable and respectable.", "effect": "Macduff trusts Macbeth completely. In Scene 2.2 Lady Macbeth used the same words (“Why, worthy thane”) while telling him off for losing his nerve. Here they are used sincerely, which makes them quietly ironic.", "ask": "Who does the audience feel sorry for here: Macduff or Macbeth? Why?", "tags": ["irony", "appearance"]}, {"id": "a2n13-2", "from": 49, "to": 52, "title": "Calm, polite, in control", "meaning": "Macbeth gives short, courteous answers to Macduff’s questions: “Not yet.” “I’ll bring you to him.” He sounds like a helpful host.", "effect": "A few hours ago Macbeth stood shaking and said “I am afraid to think what I have done.” Now he is calm and polite. He has already learned to act a part. Lady Macbeth taught him in Act 1 to “look like th’ innocent flower”; he is now doing it without her.", "ask": "What has happened to the Macbeth who could barely finish a sentence in Scene 2.2?", "tags": ["ambition", "appearance", "peel"]}, {"id": "a2n13-3", "from": 53, "to": 56, "title": "Dramatic irony: we know what is behind the door", "meaning": "Macduff says that looking after a royal guest must be a “joyful trouble”. Macbeth replies with a neat saying: work we enjoy (“labor we delight in”) cures (“physics”) the pain it causes. Then he points: “This is the door.”", "effect": "The audience knows exactly what is behind that door. Macbeth’s calm, ordinary words are chilling because he is walking Macduff towards the body. “The labor we delight in” could even describe the murder itself.", "ask": "Why does Shakespeare make Macbeth’s words so ordinary at this moment?", "tags": ["irony", "appearance", "language"]}, {"id": "a2n13-4", "at": 70, "phrase": "’Twas a rough night.", "title": "A huge understatement", "meaning": "Lennox has just described chimneys blown down, screams of death in the air, and the Earth itself shaking. Macbeth answers in four words: “’Twas a rough night.”", "effect": "Understatement means saying much less than the truth, and it can be a way of hiding something. Macbeth is acting casual. The audience will also connect the storm with his crime: nature seems to be reacting to what he has done (you will see this idea again in Scene 2.4).", "ask": "Why might showing too little emotion be as suspicious as showing too much?", "tags": ["appearance", "language", "ahead", "irony"]}, {"id": "a2n13-10", "from": 73, "to": 74, "title": "Macduff finds the body", "meaning": "Macduff is the one who discovers Duncan’s body. He cries “O horror, horror, horror!” and says that neither “tongue” nor “heart” can “conceive” (imagine) or “name” it.", "effect": "Macduff’s horror is real: he cannot find words. Compare Macbeth, who has just answered the night’s terrors with “’Twas a rough night.” Shakespeare puts an honest reaction next to a performance so the audience can see the difference.", "ask": "How is Macduff’s reaction different from Macbeth’s? Which one sounds real?", "tags": ["appearance", "language", "irony"]}, {"id": "a2n13-11", "at": 86, "phrase": "Murder and treason!", "title": "Word to know: treason", "meaning": "Treason means betraying your king or your country. Killing a king was the worst crime of all in Shakespeare’s time, because people believed the king was chosen by God. Macduff calls it both “murder and treason”.", "effect": "Macbeth was Duncan’s subject, and in Act 1 Duncan honoured him as his “worthiest cousin”. By committing treason, Macbeth has betrayed the very king who trusted and rewarded him, and all for his own ambition.", "ask": "Why would an audience in 1606 see treason as even worse than ordinary murder?", "tags": ["ambition", "language", "peel"]}, {"id": "a2n13-12", "from": 88, "to": 90, "title": "“Death’s counterfeit” and “the great doom’s image”", "meaning": "Macduff calls sleep “death’s counterfeit” (a fake copy of death) and tells everyone to wake up and look at real death. “The great doom’s image” means a picture of Doomsday, the Day of Judgment at the end of the world.", "effect": "Macduff compares the murder to the end of the world. It echoes “Macbeth does murder sleep” from Scene 2.2: the man who killed sleep is now the reason everyone is woken. The scene is also filled with sleep and waking, a pattern Shakespeare will return to.", "ask": "Why might Shakespeare make Macduff compare the murder to Doomsday?", "tags": ["language", "ahead", "guilt"]}, {"id": "a2n13-5", "from": 93, "to": 95, "title": "She plays the innocent", "meaning": "Lady Macbeth enters and asks what the alarm is for. She calls the bell a “hideous trumpet” that “calls to parley” (summons to a meeting) the sleeping household.", "effect": "She sounds like a woman woken in alarm. In Act 1 she told Macbeth to “look like th’ innocent flower, but be the serpent under ’t.” Now she is the one acting innocent.", "ask": "Why does she ask a question she already knows the answer to?", "tags": ["lady", "appearance"]}, {"id": "a2n13-6", "from": 96, "to": 99, "title": "Word to know: situational irony", "meaning": "Macduff calls her “gentle lady” and says that hearing the news would “murder” her: it is not fit for a woman’s ear. He wants to protect her.", "effect": "He is protecting one of the people who planned the murder. The real situation is the opposite of what Macduff thinks it is. When what happens, or what is said, is the opposite of what you would expect, that is situational irony: today’s word. Remember that Lady Macbeth asked the spirits to “unsex” her and fill her with cruelty. She is anything but “gentle”.", "ask": "Where else in this scene does someone’s description turn out to be the opposite of the truth?", "tags": ["irony", "lady", "peel"]}, {"id": "a2n13-7", "from": 102, "to": 104, "title": "Shock that is not real", "meaning": "Lady Macbeth cries “Woe, alas! What, in our house?” as if the worst part is that it happened under her own roof. Banquo replies simply: “Too cruel anywhere.”", "effect": "Her question is an act, and Banquo’s calm reply gently shows how odd it is: murder is cruel in any place. The audience knows exactly how it happened in her house, because she helped plan it. Compare Act 1 Scene 6, where she welcomed Duncan to this very castle as an honoured guest.", "ask": "How does Banquo’s reply make Lady Macbeth’s question sound slightly odd?", "tags": ["irony", "lady", "appearance", "peel"]}, {"id": "a2n13-8", "from": 107, "to": 109, "title": "A speech of grief, or a confession?", "meaning": "Macbeth says that if he had died an hour before this “chance” (event), he would have lived a “blessèd time”, because from this moment “there’s nothing serious in mortality” (human life has lost all its meaning).", "effect": "On the surface this is a performance of grief for the dead king. But “an hour before” is exactly when Macbeth was still innocent, before the murder. A lie that contains a truth is one of Shakespeare’s favourite effects. The crime he committed for ambition has already emptied his life of meaning.", "ask": "Is Macbeth only acting here, or does some of this come from the heart? Find a word to support your view.", "tags": ["ambition", "guilt", "irony", "peel"]}, {"id": "a2n13-9", "from": 110, "to": 112, "title": "Everything is “toys”", "meaning": "Macbeth says that all human life is just “toys” (worthless trifles), that honour and goodness (“renown and grace”) are dead, and that the “wine of life” has been poured out, leaving only dregs (“lees”) in an empty cellar (“vault”) for the world to boast about.", "effect": "The wine image makes life sound like a barrel emptied by a single act. As a performance it sounds exaggerated, as if he is trying too hard, yet it also looks ahead: near the end of the play he will call life “a tale told by an idiot”. Listen for the same bleak view of life returning in Act 5.", "ask": "If Macbeth has just got what he wanted, why does he say that nothing matters?", "tags": ["language", "ambition", "ahead", "guilt", "peel"]}], "gloss": [["thane", "a Scottish lord"], ["timely", "early"], ["physics", "cures, eases (used here as a verb)"], ["limited service", "a duty he has been given; his official task"], ["treason", "betraying your king or your country"], ["alarum", "alarm (an old spelling)"], ["counterfeit", "a fake copy"], ["doom", "Judgment Day, the end of the world"], ["parley", "a meeting or talk, usually between enemies"], ["repetition", "repeating it; saying it again"], ["mortality", "human life"], ["toys", "trifles, worthless things"], ["lees", "the dregs left at the bottom of a wine barrel"], ["vault", "a cellar (here: the empty world)"]]}, {"type": "plenary", "key": "a2h4-end", "short": "Exit", "mins": 7, "title": "Exit ticket", "ticket": [{"q": "Find one line where Macbeth stays calm and polite while Duncan lies dead upstairs.", "a": "For example “Not yet”, “I’ll bring you to him”, “The labor we delight in physics pain. / This is the door” or “’Twas a rough night.”"}, {"q": "Explain what situational irony means, and give one example from today’s scene.", "a": "It is when what happens (or what is said) is the opposite of what you’d expect. For example, Macduff calls Lady Macbeth “gentle” and protects her from news of a murder she helped plan, or Lady Macbeth asks “What, in our house?” as if she were shocked."}, {"q": "Ambition tracker: at the end of Scene 2.2 Macbeth said “I am afraid to think what I have done.” How does he sound in this scene, and what has changed?", "a": "He sounds calm, polite and in control, and he performs grief in front of the lords. His ambition now depends on lying convincingly, so he has moved from a guilt-stricken man to a man deliberately hiding what he has done."}, {"q": "Is Macbeth only acting when he says “Had I but died an hour before this chance”? Give a reason for your view.", "a": "Either view can be argued. Acting: a murderer shows grief so that nobody suspects him. Partly true: he really does look back on the time before the murder as “a blessèd time”, and “nothing serious in mortality” sounds like genuine despair."}], "next": "Next lesson: Macbeth explains why he killed the guards, and Duncan’s sons decide they are not safe."}], "aims": {"li": "To explore how Macbeth and Lady Macbeth behave in public on the morning after the murder, and to understand what situational irony is.", "sc": ["I can explain what situational irony means.", "I can find a line where Macbeth or Lady Macbeth acts differently from how they really feel.", "I can explain how Macbeth has changed since the end of Scene 2.2."], "word": {"w": "situational irony", "m": "when what happens (or what is said) is the opposite of what you’d expect.", "eg": "Macduff calls Lady Macbeth a “gentle lady” who must be protected from news of a murder that she helped to plan. Use the term in one sentence today."}, "bridge": "Last lesson ended with a knocking at the gate and Macbeth wishing the knocking could wake Duncan. This scene opens at the same gate, a little later, as the household wakes."}}, {"title": "Act 2, Lesson 5", "subtitle": "Scene 2.3: Macbeth explains himself", "steps": [{"type": "aims", "key": "a2h5-aims", "short": "Aims", "mins": 5, "title": "Today’s lesson", "doNow": {"title": "Do now: what do you remember?", "qa": [{"q": "What does “situational irony” mean?", "a": "When what happens (or what is said) is the opposite of what you’d expect."}, {"q": "Which character did Macduff call a “gentle lady”, and why is that ironic?", "a": "Lady Macbeth. It is ironic because she helped plan the murder and asked the spirits to fill her with cruelty."}, {"q": "How did Macbeth reply when Lennox described the strange, stormy night? What does his reply suggest?", "a": "He said only “’Twas a rough night.” This understatement suggests he is acting calm and hiding what he knows."}]}}, {"type": "link", "key": "a2l5", "short": "What’s happening", "mins": 3, "title": "Everyone gathers", "text": "Macduff has raised the alarm and the whole household gathers. Macbeth and Lennox have been in to see Duncan’s body. Lennox says that the {{guards}} in Duncan’s chamber were covered in blood, with unwiped daggers on their pillows. Macbeth then admits that, in a burst of {{fury}}, he has already killed them. Macduff asks him why. Duncan’s sons, {{Malcolm}} and Donalbain, listen in silence.", "hinge": {"q": "Why is it convenient for Macbeth that the guards are dead?", "opts": ["Dead guards can no longer say that they did not do it.", "He no longer has to pay them.", "They were his enemies.", "It makes the castle quieter."], "correct": 0, "why": "Dead men cannot tell anyone what really happened, so the blame stays with the guards. Macbeth’s “fury” silences the only people who could have named the real killer."}}, {"type": "extract", "key": "a2e14", "short": "2.3 Excuses", "mins": 15, "label": "Extract 14", "title": "Act 2, Scene 3: Macbeth explains himself", "sub": "The guards, and the brothers who flee", "scene": "2.3", "setup": "Macbeth has just admitted that he killed the guards. Macduff asks why. Listen to how Macbeth explains himself, and decide whether it sounds like real feeling or a performance.", "think": "With a partner (30 seconds): does Macbeth’s speech sound like real grief, or a performance? Find one word to support your view.", "thinkSecs": 30, "task": "Underline two phrases where Macbeth claims he acted out of love. Circle the phrase where Malcolm explains how easy it is to fake sorrow.", "lines": [{"k": "sp", "t": "Macbeth"}, {"k": "ln", "n": 124, "t": "O, yet I do repent me of my fury,"}, {"k": "ln", "n": 125, "t": "That I did kill them."}, {"k": "sp", "t": "Macduff"}, {"k": "ln", "n": 126, "t": "Wherefore did you so?"}, {"k": "sp", "t": "Macbeth"}, {"k": "ln", "n": 127, "t": "Who can be wise, amazed, temp’rate, and furious,"}, {"k": "ln", "n": 128, "t": "Loyal, and neutral, in a moment? No man."}, {"k": "ln", "n": 129, "t": "Th’ expedition of my violent love"}, {"k": "ln", "n": 130, "t": "Outrun the pauser, reason. Here lay Duncan,"}, {"k": "ln", "n": 131, "t": "His silver skin laced with his golden blood,"}, {"k": "ln", "n": 132, "t": "And his gashed stabs looked like a breach in nature"}, {"k": "ln", "n": 133, "t": "For ruin’s wasteful entrance; there the murderers,"}, {"k": "ln", "n": 134, "t": "Steeped in the colors of their trade, their daggers"}, {"k": "ln", "n": 135, "t": "Unmannerly breeched with gore. Who could refrain"}, {"k": "ln", "n": 136, "t": "That had a heart to love, and in that heart"}, {"k": "ln", "n": 137, "t": "Courage to make ’s love known?"}, {"k": "sp", "t": "Lady Macbeth"}, {"k": "ln", "n": 138, "t": "Help me hence, ho!"}, {"k": "sp", "t": "Macduff"}, {"k": "ln", "n": 139, "t": "Look to the lady."}, {"k": "gap", "t": "[…Malcolm and Donalbain whisper that they dare not speak. Lady Macbeth is helped out. Banquo says they must meet to question this “bloody piece of work”, and Macduff agrees…]"}, {"k": "sp", "t": "Macbeth"}, {"k": "ln", "n": 157, "t": "Let’s briefly put on manly readiness"}, {"k": "ln", "n": 158, "t": "And meet i’ th’ hall together."}, {"k": "st", "t": "All but Malcolm and Donalbain exit.", "key": "s158"}, {"k": "sp", "t": "Malcolm"}, {"k": "ln", "n": 160, "t": "What will you do? Let’s not consort with them."}, {"k": "ln", "n": 161, "t": "To show an unfelt sorrow is an office"}, {"k": "ln", "n": 162, "t": "Which the false man does easy. I’ll to England."}, {"k": "sp", "t": "Donalbain"}, {"k": "ln", "n": 163, "t": "To Ireland I. Our separated fortune"}, {"k": "ln", "n": 164, "t": "Shall keep us both the safer. Where we are,"}, {"k": "ln", "n": 165, "t": "There’s daggers in men’s smiles. The near in blood,"}, {"k": "ln", "n": 166, "t": "The nearer bloody."}], "notes": [{"id": "a2n14-1", "from": 124, "to": 126, "title": "A second killing", "meaning": "Macbeth says he regrets the “fury” in which he killed the guards. Macduff asks the question the audience is also asking: “Wherefore did you so?” (Why did you do it?)", "effect": "It took Macbeth a whole play’s worth of doubt, and Lady Macbeth’s pressure, to kill Duncan. The guards he kills alone, quickly and without discussion. His ambition no longer needs persuading.", "ask": "Compare how long Macbeth took to decide to kill Duncan with how quickly he killed the guards. What does that tell you?", "tags": ["ambition", "guilt", "peel"]}, {"id": "a2n14-2", "from": 127, "to": 128, "title": "“Who can be wise… in a moment?”", "meaning": "Macbeth asks a question: who can be “wise, amazed (stunned), temp’rate (calm) and furious, loyal and neutral” all at once? His answer: “No man.”", "effect": "He excuses himself with a list of opposites, which echoes “fair is foul” from Act 1. But nobody asked for such a long defence. The more he explains, the less natural he sounds.", "ask": "Why might a speech that tries very hard to explain make people more suspicious?", "tags": ["language", "appearance"]}, {"id": "a2n14-3", "from": 129, "to": 130, "title": "“Violent love”", "meaning": "“Expedition” means speed. Macbeth claims his love for Duncan was so violent that it outran reason (“the pauser”: the part of the mind that makes you pause and think).", "effect": "He pretends his rage came from love. “Violent love” is a contradiction: love should not be violent. In Act 1 Scene 7 Macbeth spent a whole speech weighing reasons not to kill Duncan; now he says reason was far too slow.", "ask": "Why is “violent love” a strange phrase? Which Act 1 phrase does it remind you of?", "tags": ["ambition", "language", "appearance", "peel"]}, {"id": "a2n14-4", "from": 131, "to": 133, "title": "Beautiful words for an ugly sight", "meaning": "He describes Duncan’s body: “silver skin laced with his golden blood”, his wounds like a “breach in nature” (a gap broken in a wall) through which “ruin” (destruction) entered.", "effect": "These are rich, decorated images: silver, gold, a broken wall. Real shock rarely sounds so poetic. Compare Macbeth’s plain, frightened words in Scene 2.2 (“I’ll go no more”). Here he is choosing words to impress his audience.", "ask": "Why does the language of a person in real shock usually sound plainer than this?", "tags": ["language", "appearance", "guilt", "peel"]}, {"id": "a2n14-5", "from": 134, "to": 135, "title": "The guards as villains", "meaning": "He says the guards were “steeped in the colors of their trade” (soaked in the colour of their work: murder) and their daggers “unmannerly breeched with gore” (the blades wearing the blood like clothes, shamelessly).", "effect": "Macbeth makes sure the guards look guilty, just as Lady Macbeth planned (“I’ll gild the faces of the grooms”). He is now building the cover story himself.", "tags": ["appearance", "language", "lady", "peel"]}, {"id": "a2n14-6", "from": 136, "to": 137, "title": "Word to know: hypocrite", "meaning": "He ends by asking who could hold back who had “a heart to love” Duncan and the “courage to make ’s love known” (to show that love).", "effect": "The man who killed Duncan finishes by claiming to be Duncan’s most loyal lover. That makes him a hypocrite: someone who pretends to have feelings or beliefs that they do not really have. The more he claims love, the more outrageous the lie.", "ask": "Is this the same Macbeth who said “I am afraid to think what I have done”? What has changed?", "tags": ["ambition", "appearance", "guilt", "peel"]}, {"id": "a2n14-7", "from": 138, "to": 139, "title": "Real faint, or fake?", "meaning": "Lady Macbeth suddenly cries “Help me hence, ho!” (help me out of here), and Macduff says “Look to the lady.”", "effect": "Directors disagree about this moment. Is she genuinely overcome? Or is she pretending to faint to interrupt a speech in which her husband is overdoing it? Either way, it moves everyone’s attention away from Macbeth.", "ask": "Real faint or fake? Find one reason for each view.", "tags": ["lady", "appearance", "peel"]}, {"id": "a2n14-10", "from": 157, "to": 158, "title": "Macbeth takes charge", "meaning": "Macbeth suggests that everyone should get dressed (they have all been woken in their nightclothes) and show courage and self-control (“manly readiness”), then meet together in the hall to decide what to do.", "effect": "The man who committed the murder is now organising the response to it. He sounds sensible, calm and in control, and the lords all agree (“Well contented”). It is the first time we see Macbeth give orders as if he were already the leader. Notice that he says “put on”: like clothes, readiness is something you wear.", "ask": "Why is it ironic that Macbeth is the one telling everyone what to do? What does “put on” suggest?", "tags": ["ambition", "appearance", "irony"]}, {"id": "a2n14-8", "from": 160, "to": 162, "title": "“An unfelt sorrow”", "meaning": "Malcolm warns his brother not to stay with the others. “To show an unfelt sorrow is an office / Which the false man does easy”: pretending to be sad is a job (“office”) that a dishonest person finds easy.", "effect": "Malcolm has seen through the show of grief around him. Shakespeare gives the audience a character on stage who thinks what we think: that some of this sorrow is false.", "ask": "How does Malcolm help the audience see through Macbeth’s performance?", "tags": ["appearance", "peel"]}, {"id": "a2n14-9", "from": 163, "to": 166, "title": "“Daggers in men’s smiles”", "meaning": "Donalbain agrees that wherever they stay, “there’s daggers in men’s smiles”: danger hides behind friendly faces. “The near in blood, the nearer bloody” means that the people closest to them by blood are the most dangerous.", "effect": "This is Macbeth’s own phrase from Act 1 Scene 7, “false face must hide what the false heart doth know”, seen from the victim’s side. By fleeing, the brothers make themselves look guilty, which is exactly what Macbeth needs.", "tags": ["appearance", "ahead", "peel"]}], "gloss": [["wherefore", "why"], ["repent", "regret; feel sorry for"], ["amazed", "stunned, bewildered"], ["temp’rate", "calm, self-controlled"], ["expedition", "speed"], ["pauser", "the part of the mind that makes you pause (here: reason)"], ["breach", "a gap or break in a wall"], ["gore", "thick, spilled blood"], ["office", "a job or duty"], ["manly readiness", "courage and self-control (and being dressed, ready for action)"], ["consort", "keep company"]]}, {"type": "link", "key": "a2l6", "short": "What’s happening", "mins": 3, "title": "The brothers escape", "text": "Malcolm and Donalbain decide to escape while everyone else is busy: Malcolm will go to {{England}} and Donalbain to {{Ireland}}. Because they have run away, people will start to say that the sons paid the guards to kill their father. This suits Macbeth, because nobody now stands between him and the {{crown}}.", "hinge": {"q": "Why does running away make Malcolm and Donalbain look guilty?", "opts": ["It looks as though they are afraid of being caught.", "They were seen holding the daggers.", "They were not sad when they heard the news.", "They had argued with Duncan."], "correct": 0, "why": "Innocent people usually stay to help find the killer. Running away looks like fear of being caught, so suspicion falls on the sons rather than on Macbeth."}}, {"type": "plenary", "key": "a2h5-end", "short": "Exit", "mins": 7, "title": "Exit ticket", "ticket": [{"q": "Find a quotation where Macbeth claims he acted out of love for Duncan.", "a": "For example “Th’ expedition of my violent love / Outrun the pauser, reason” or “Who could refrain / That had a heart to love, and in that heart / Courage to make ’s love known?”"}, {"q": "Explain why Macbeth is a hypocrite in this extract. Use one quotation.", "a": "He says he killed the guards out of loyalty and “violent love” for Duncan, when he is the man who murdered Duncan and who silenced the only witnesses. He is pretending to feel something he does not."}, {"q": "Ambition tracker: compare how Macbeth reacts to the first murder (Scene 2.2) with how he explains this second killing.", "a": "After the first murder he was frozen by guilt (“I am afraid to think what I have done”). Now he kills again by himself, and then explains it with a polished, fluent speech. Guilt has not gone, but he has learned to hide it behind a performance."}, {"q": "Why do Malcolm and Donalbain run away, and who benefits?", "a": "They sense danger (“There’s daggers in men’s smiles”) and fear they may be next. Their escape makes them look guilty, so Macbeth benefits most: nobody is looking at him, and the crown is within reach."}], "next": "Next lesson: we leave the castle. Ross and an Old Man describe a night when nature itself seems to have turned against the crime, and Macbeth is named king."}], "aims": {"li": "To explore how Macbeth explains killing the guards, and to understand what a hypocrite is.", "sc": ["I can explain what a hypocrite is.", "I can find a quotation where Macbeth claims he acted out of love for Duncan.", "I can explain why Malcolm and Donalbain do not trust the show of sorrow around them."], "word": {"w": "hypocrite", "m": "a person who pretends to have feelings or beliefs that they do not really have.", "eg": "Macbeth says he killed the guards out of “violent love” for Duncan, when he is the one who murdered the king. Use the word in one sentence today."}, "bridge": "Last lesson, Macbeth gave a calm, polite performance while the household woke. In this part of the scene, he has to explain why he has already killed the only two witnesses."}}, {"title": "Act 2, Lesson 6", "subtitle": "Scene 2.4: the cost of ambition", "steps": [{"type": "aims", "key": "a2h6-aims", "short": "Aims", "mins": 5, "title": "Today’s lesson", "doNow": {"title": "Do now: what do you remember?", "qa": [{"q": "What is a hypocrite?", "a": "A person who pretends to have feelings or beliefs that they do not really have."}, {"q": "Where did Malcolm and Donalbain decide to go, and why?", "a": "Malcolm to England and Donalbain to Ireland, because they feared for their lives: “There’s daggers in men’s smiles.”"}, {"q": "Why does it help Macbeth that Duncan’s sons run away?", "a": "Their escape makes them look guilty, so suspicion falls on them instead of on Macbeth."}]}}, {"type": "link", "key": "a2l7", "short": "What’s happening", "mins": 3, "title": "Outside the castle", "text": "Scene 2.4 takes place outside the castle. An Old Man tells {{Ross}}, a Scottish lord, that in seventy years he has never known a night like this. By the clock it is morning, but the sky is still {{dark}}. Strange things are happening in nature too: a falcon has been killed by an {{owl}}, and Duncan’s {{horses}} have gone wild.", "hinge": {"q": "Why might Shakespeare make it dark in the middle of the day?", "opts": ["To show that nature is disturbed by Duncan’s murder", "Because the sun was broken", "Because the theatre was dark", "To show that Ross cannot see"], "correct": 0, "why": "The dark sky mirrors the dark deed. Nothing in nature behaves normally since Duncan died. This is today’s word, pathetic fallacy."}}, {"type": "extract", "key": "a2e15", "short": "2.4 Nature", "mins": 15, "label": "Extract 15", "title": "Act 2, Scene 4: Ross, the Old Man and Macduff", "sub": "Outside the castle", "scene": "2.4", "setup": "We leave the castle behind. Outside, Ross and an Old Man talk about the night, then Macduff arrives with news. Look for how nature reacts to the murder, and what the other lords think of Macbeth.", "think": "With a partner (30 seconds): what is odd about the weather and the animals in this scene? Why might Shakespeare want it to be odd?", "thinkSecs": 30, "task": "Underline one line where nature behaves strangely. Circle the line where Ross names ambition.", "lines": [{"k": "sp", "t": "Ross"}, {"k": "ln", "n": 6, "t": "Ha, good father,"}, {"k": "ln", "n": 7, "t": "Thou seest the heavens, as troubled with man’s act,"}, {"k": "ln", "n": 8, "t": "Threatens his bloody stage. By th’ clock ’tis day,"}, {"k": "ln", "n": 9, "t": "And yet dark night strangles the traveling lamp."}, {"k": "ln", "n": 10, "t": "Is ’t night’s predominance or the day’s shame"}, {"k": "ln", "n": 11, "t": "That darkness does the face of earth entomb"}, {"k": "ln", "n": 12, "t": "When living light should kiss it?"}, {"k": "sp", "t": "Old Man"}, {"k": "ln", "n": 13, "t": "’Tis unnatural,"}, {"k": "ln", "n": 14, "t": "Even like the deed that’s done. On Tuesday last"}, {"k": "ln", "n": 15, "t": "A falcon, tow’ring in her pride of place,"}, {"k": "ln", "n": 16, "t": "Was by a mousing owl hawked at and killed."}, {"k": "gap", "t": "[…Ross adds that Duncan’s horses went wild and, the Old Man says, ate each other. Macduff enters…]"}, {"k": "sp", "t": "Ross"}, {"k": "ln", "n": 31, "t": "Is ’t known who did this more than bloody deed?"}, {"k": "sp", "t": "Macduff"}, {"k": "ln", "n": 32, "t": "Those that Macbeth hath slain."}, {"k": "sp", "t": "Ross"}, {"k": "ln", "n": 33, "t": "Alas the day,"}, {"k": "ln", "n": 34, "t": "What good could they pretend?"}, {"k": "sp", "t": "Macduff"}, {"k": "ln", "n": 35, "t": "They were suborned."}, {"k": "ln", "n": 36, "t": "Malcolm and Donalbain, the King’s two sons,"}, {"k": "ln", "n": 37, "t": "Are stol’n away and fled, which puts upon them"}, {"k": "ln", "n": 38, "t": "Suspicion of the deed."}, {"k": "sp", "t": "Ross"}, {"k": "ln", "n": 39, "t": "’Gainst nature still!"}, {"k": "ln", "n": 40, "t": "Thriftless ambition, that will ravin up"}, {"k": "ln", "n": 41, "t": "Thine own lives’ means. Then ’tis most like"}, {"k": "ln", "n": 42, "t": "The sovereignty will fall upon Macbeth."}, {"k": "sp", "t": "Macduff"}, {"k": "ln", "n": 43, "t": "He is already named and gone to Scone"}, {"k": "ln", "n": 44, "t": "To be invested."}, {"k": "gap", "t": "[…Macduff says Duncan’s body has been carried to Colmekill, the royal burial place. Ross asks whether he will go to Scone for the crowning…]"}, {"k": "sp", "t": "Macduff"}, {"k": "ln", "n": 50, "t": "No, cousin, I’ll to Fife."}, {"k": "sp", "t": "Ross"}, {"k": "ln", "n": 51, "t": "Well, I will thither."}, {"k": "sp", "t": "Macduff"}, {"k": "ln", "n": 52, "t": "Well, may you see things well done there. Adieu,"}, {"k": "ln", "n": 53, "t": "Lest our old robes sit easier than our new."}], "notes": [{"id": "a2n15-1", "from": 7, "to": 9, "title": "Word to know: pathetic fallacy", "meaning": "Ross says the heavens, “troubled with man’s act”, seem to threaten the human world (his “bloody stage”). By the clock it is day, but “dark night strangles the traveling lamp”: darkness is choking the sun as it crosses the sky.", "effect": "When the weather or nature seems to mirror what is happening in the story, that is pathetic fallacy: today’s word. Darkness at midday matches the
