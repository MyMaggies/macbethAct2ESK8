 fallen into place. Notice that Macduff’s account puts Macbeth’s name at the centre, without accusing him.", "ask": "Why might Macduff mention Macbeth’s name here, while still repeating the official story?", "tags": ["appearance", "lady", "ambition"]}, {"id": "a2n15-5", "from": 36, "to": 38, "title": "The sons look guilty", "meaning": "Macduff reports that Malcolm and Donalbain, the King’s two sons, have “stol’n away and fled”, which “puts upon them suspicion of the deed.”", "effect": "Their escape makes them look guilty. It is exactly what Macbeth needs. His plan has worked better than he could have hoped, and nobody is looking at him.", "ask": "Who benefits most from Malcolm and Donalbain running away?", "tags": ["appearance", "ambition", "peel"]}, {"id": "a2n15-6", "from": 39, "to": 42, "title": "“Thriftless ambition”", "meaning": "Ross cries “’Gainst nature still!” and blames “thriftless ambition”: wasteful ambition that “ravins up” (greedily devours) “thine own lives’ means”, the very thing that keeps it alive. He guesses the sons are guilty, and that the crown will “fall upon Macbeth.”", "effect": "Ross blames the wrong people, but he has named the play’s big idea: ambition that destroys itself. The audience knows he is describing Macbeth, not the sons. Compare Macbeth’s own warning in Act 1 Scene 7: “vaulting ambition, which o’erleaps itself.” Ross has said almost the same thing without knowing it.", "ask": "Whose ambition is Ross really describing, without knowing it?", "tags": ["ambition", "irony", "ahead", "peel"]}, {"id": "a2n15-7", "from": 43, "to": 44, "title": "“Already named and gone to Scone”", "meaning": "Macduff says Macbeth is “already named” as the next king and has gone to Scone, where Scottish kings were crowned (“invested”).", "effect": "In Act 1 Scene 3 Macbeth said “If chance will have me king, why, chance may crown me.” He has not waited for chance. Duncan is barely buried and Macbeth is already on his way to the crown. His ambition, once held back by doubt, now moves fast.", "ask": "Which is faster: the Macbeth of Act 1 Scene 3, or the Macbeth of Scene 2.4? Why does the speed matter?", "tags": ["ambition", "ahead", "peel"]}, {"id": "a2n15-8", "from": 50, "to": 51, "title": "Macduff goes home", "meaning": "Ross asks if Macduff will go to Scone for the crowning. Macduff says “No, cousin, I’ll to Fife” (his own home and lands).", "effect": "Macduff is the first person to quietly withdraw his support. He does not accuse Macbeth, but staying away sends a message. Remember this: Macduff will become Macbeth’s greatest enemy later in the play.", "ask": "What does Macduff say about Macbeth by choosing not to go to Scone?", "tags": ["appearance", "ahead"]}, {"id": "a2n15-9", "from": 52, "to": 53, "title": "Old robes and new", "meaning": "Macduff wishes Ross well at the crowning and says goodbye, “lest our old robes sit easier than our new”: in case the old king’s reign was more comfortable than the new one will be.", "effect": "Robes stand for power. Macduff politely hints that Duncan will turn out better than his successor. In Act 1, Macbeth asked “Why do you dress me in borrowed robes?” when he was named Thane of Cawdor. These robes are his own, but they may not fit.", "ask": "What is Macduff saying without actually saying it?", "tags": ["language", "ambition", "ahead", "peel"]}], "gloss": [["predominance", "power; being in charge"], ["traveling lamp", "the sun"], ["entomb", "bury"], ["tow’ring", "flying high"], ["mousing owl", "an owl that hunts mice"], ["suborned", "secretly bribed or persuaded"], ["thriftless", "wasteful"], ["ravin up", "devour greedily"], ["sovereignty", "kingship; supreme power"], ["invested", "formally crowned"], ["lest", "in case"]]}, {"type": "plenary", "key": "a2h6-end", "short": "Exit", "mins": 7, "title": "Exit ticket", "ticket": [{"q": "Find a quotation that shows nature has been disturbed by Duncan’s murder.", "a": "For example “By th’ clock ’tis day, / And yet dark night strangles the traveling lamp”, or the falcon “by a mousing owl hawked at and killed”."}, {"q": "Explain what pathetic fallacy means, and give one example from Scene 2.4.", "a": "It is when the weather or nature seems to mirror the mood or events of the story. For example, darkness covering the earth at midday matches the dark deed of Duncan’s murder."}, {"q": "Why is Ross wrong about who is guilty, and what is ironic about his words “thriftless ambition”?", "a": "He blames Malcolm and Donalbain because they ran away. The audience knows the ambition that destroys itself is Macbeth’s, so Ross’s phrase fits Macbeth far better than the sons."}, {"q": "Ambition tracker: in one phrase each, describe Macbeth in Scenes 2.1, 2.2, 2.3 and 2.4.", "a": "For example: 2.1 determined but troubled, arguing with a dagger of his own imagination; 2.2 frozen with guilt (“I am afraid to think what I have done”); 2.3 calm and acting, a hypocrite who kills again; 2.4 named king and on his way to Scone, while nature itself is disturbed."}, {"q": "Choose your strongest piece of evidence from Act 2 for “How does Shakespeare present Macbeth’s ambition?” Say why you chose it.", "a": "Any well-explained choice. For example “Thou marshal’st me the way that I was going” shows his ambition comes from his own mind; “violent love” shows how far he will twist the truth to protect it."}], "next": "Next: Act 3 begins with Macbeth as king. Does the crown bring him the safety he wanted?"}], "aims": {"li": "To explore how Shakespeare uses nature to show the damage done by Macbeth’s ambition, and to understand what pathetic fallacy is.", "sc": ["I can explain what pathetic fallacy means.", "I can find a quotation that shows nature has been disturbed by Duncan’s murder.", "I can compare Macbeth at the start of Act 2 with Macbeth at the end of it."], "word": {"w": "pathetic fallacy", "m": "when the weather or nature seems to mirror the mood or events of the story.", "eg": "Darkness covers the land at midday, as if the sky itself is shocked by Duncan’s murder. Use the term in one sentence today."}, "bridge": "Last lesson, Macbeth explained away a second killing while Malcolm and Donalbain escaped. This scene takes us outside the castle, away from Macbeth, to see how the rest of Scotland reads the night."}}], "QUIZ": []};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s) => esc(s).replace(/\[([^\]]+)\]/g, '<i class="sd">[$1]</i>');
const SHORT = { ambition: "Ambition", language: "Language", appearance: "Appearance", ahead: "Look ahead", guilt: "Guilt", lady: "Lady Macbeth", peel: "★ PEEL evidence", irony: "Irony" };
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ratings are the only thing kept on the device, and only if the browser allows it */
const RKEY = "macbeth-act2-ratings";
function loadRate() { try { return JSON.parse(localStorage.getItem(RKEY) || "{}"); } catch (e) { return {}; } }
function saveRate() { try { localStorage.setItem(RKEY, JSON.stringify(S.rate)); } catch (e) { /* storage unavailable */ } }

/* S.drawer: which side panel is open (null = closed). S.wide / S.mainHidden: how the two panes share the screen. S.focus: extract-only mode. */
const S = { view: "lesson", h: 0, s: 0, tag: "all", sel: null, scale: 1, drawer: null, wide: false, mainHidden: false, focus: false,
  rev: { tab: "quotes", tag: "all", quiz: null }, rate: loadRate(), battle: { r: 0, meter: 20, picked: null } };
const cur = () => DATA.hours[S.h].steps[S.s];
let DR = {}; /* drawers of the step on screen */

/* order notes by position in the text */
DATA.hours.forEach((h) => h.steps.forEach((st) => {
  if (st.type !== "extract") return;
  const posOf = (n) => {
    let i;
    if (n.stage) i = st.lines.findIndex((l) => l.k === "st" && l.key === n.stage);
    else { const ln = n.at !== undefined ? n.at : n.from; i = st.lines.findIndex((l) => l.k === "ln" && l.n === ln); }
    return i * 1000 + (n.phrase && !n.stage ? Math.max(0, (st.lines[i].t || "").indexOf(n.phrase)) : 0);
  };
  st.notes.forEach((n) => (n._pos = posOf(n)));
  st.notes.sort((a, b) => a._pos - b._pos);
}));

const tagOK = (n, tag) => tag === "all" || n.tags.includes(tag);
const match = (n) => tagOK(n, S.tag);
const visible = (st) => st.notes.filter(match);
const byId = (st, id) => st.notes.find((n) => n.id === id);

/* ---------- top bar: lessons menu + navigation ---------- */
function renderTop() {
  $("#lbl").textContent = DATA.hours[S.h].title;
  $("#lmenu").innerHTML = DATA.hours.map((h, i) =>
    `<button class="lm${i === S.h ? " on" : ""}" data-h="${i}"><b>${esc(h.title)}</b><small>${esc(h.subtitle)}</small></button>`).join("");
}
function renderNav() {
  const nav = $("#nav");
  const h = DATA.hours[S.h], n = h.steps.length;
  const first = S.h === 0 && S.s === 0;
  const lastStep = S.s === n - 1, lastAll = S.h === DATA.hours.length - 1 && lastStep;
  const nextLabel = !lastStep ? `Next: ${esc(h.steps[S.s + 1].short)}` : lastAll ? "Finished" : "Next lesson";
  nav.innerHTML =
    `<button class="btn back" data-act="prev" ${first ? "disabled" : ""} aria-label="${S.s === 0 && !first ? "Last lesson" : "Back"}"><i class="ic ic-back"></i><span class="tx">${S.s === 0 && !first ? "Last lesson" : "Back"}</span></button>` +
    `<ol class="steps">` + h.steps.map((s, i) =>
      `<li class="${i < S.s ? "done" : ""}"><button class="stp ${s.type}${i === S.s ? " on" : ""}${i < S.s ? " done" : ""}" data-s="${i}" title="${esc(s.short)} · about ${s.mins} min" ${i === S.s ? 'aria-current="step"' : ""}><span class="pn">${i + 1}</span><span class="pl">${esc(s.short)}</span></button></li>`).join("") + `</ol>` +
    `<button class="btn primary next" data-act="next" ${lastAll ? "disabled" : ""}><span class="tx">${nextLabel}</span><i class="ic ic-next"></i></button>`;
}

/* ---------- bottom bar: theme filters (notes) ---------- */
function chipRow(notes, active) {
  const counts = {};
  notes.forEach((n) => n.tags.forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
  return `<span class="fl">Show notes about</span><button class="chip${active === "all" ? " on" : ""}" data-tag="all">All (${notes.length})</button>` +
    Object.keys(DATA.TAGS).filter((t) => counts[t]).map((t) =>
      `<button class="chip tg-${t}${active === t ? " on" : ""}" data-tag="${t}"><i class="dot"></i>${esc(SHORT[t])} (${counts[t]})</button>`).join("");
}
function renderFilters() {
  const el = $("#filters");
  const st = cur();
  if (st.type !== "extract") { el.hidden = true; return; }
  el.hidden = false;
  const has = new Set(); st.notes.forEach((n) => n.tags.forEach((t) => has.add(t)));
  if (S.tag !== "all" && !has.has(S.tag)) S.tag = "all";
  el.innerHTML = chipRow(st.notes, S.tag);
}

/* ---------- shared pieces ---------- */
function qaCards(qa) {
  return qa.map((q) => `<div class="qa ${q.lvl || ""}" role="button" tabindex="0" data-qa>${q.lvl ? `<span class="lv">${q.lvl === "core" ? "Core" : "Stretch"}</span>` : ""}<div class="qq">${esc(q.q)}</div><div class="aa">${esc(q.a)}</div></div>`).join("");
}
function ratingHTML(h) {
  const A = DATA.hours[h].aims;
  const items = A.stretch ? [...A.sc, A.stretch] : [...A.sc];
  return items.map((t, i) => {
    const v = S.rate[h + ":" + i];
    return `<div class="rate"><p>${A.stretch && i === A.sc.length ? "<b>Stretch:</b> " : ""}${esc(t)}</p><div class="rbtns">` +
      ["Not yet", "Nearly", "Got it"].map((l, k) => `<button class="rb${v === k ? " on" : ""}" data-rate="${h}:${i}:${k}">${l}</button>`).join("") + `</div></div>`;
  }).join("");
}
function clozeParts(text) {
  let i = 0;
  const html = esc(text).replace(/\{\{(.+?)\}\}/g, (m, a) => { i++; return `<span class="gap" data-gap role="button" tabindex="0"><sup>${i}</sup><span class="ans">${esc(a)}</span></span>`; });
  const bank = [...text.matchAll(/\{\{(.+?)\}\}/g)].map((m) => m[1]).sort((a, b) => a.localeCompare(b));
  return { html, bank };
}
function hingeHTML(hg) {
  return `<div class="hinge"><div class="lab">Quick check: vote, then reveal</div><p class="hq">${esc(hg.q)}</p>` +
    hg.opts.map((o, i) => `<button class="opt" data-hinge="${i}">${"ABCD"[i]}&nbsp; ${esc(o)}</button>`).join("") +
    `<div class="row"><button class="ghost small" data-act="hingeshow">Show answer</button></div><div class="hres" hidden></div></div>`;
}
const ideas = (items) => items.map((i) => `<div class="idea"><b>${esc(i.h)}</b><p>${esc(i.t)}</p></div>`).join("");

/* ---------- the extract ---------- */
function annSpans(text, notes) {
  const marks = [];
  notes.forEach((n) => { const i = text.indexOf(n.phrase); if (i >= 0) marks.push({ s: i, e: i + n.phrase.length, n }); });
  marks.sort((a, b) => a.s - b.s);
  let out = "", p = 0;
  marks.forEach((m) => {
    out += fmt(text.slice(p, m.s));
    out += `<span class="ann${match(m.n) ? "" : " dim"}" data-note="${m.n.id}" role="button" tabindex="0">${fmt(text.slice(m.s, m.e))}</span>`;
    p = m.e;
  });
  return out + fmt(text.slice(p));
}
function quoteOf(st, n) {
  if (n.phrase) return n.phrase;
  const ls = st.lines.filter((l) => l.k === "ln" && l.n >= n.from && l.n <= n.to).map((l) => l.t);
  return ls.length > 2 ? ls[0] + " … " + ls[ls.length - 1] : ls.join(" / ");
}
function notePanel(st, n) {
  const vis = visible(st), idx = vis.findIndex((x) => x.id === n.id);
  const tiers = (n.support || n.stretch)
    ? `<div class="tierbtns">${n.support ? `<button class="ghost small" data-act="tog" data-t="sup">Need a starter?</button>` : ""}${n.stretch ? `<button class="ghost small" data-act="tog" data-t="str">Push further</button>` : ""}</div>` +
      (n.support ? `<div class="tier sup" hidden><b>Sentence starter</b>${esc(n.support)}</div>` : "") +
      (n.stretch ? `<div class="tier str" hidden><b>Stretch question</b>${esc(n.stretch)}</div>` : "")
    : "";
  return `<div class="ptop"><span>Note ${idx + 1} of ${vis.length}</span></div>` +
    `<p class="q">${fmt(quoteOf(st, n))}</p><h3>${esc(n.title)}</h3>` +
    `<div class="lab">In plain English</div><p>${esc(n.meaning)}</p>` +
    `<div class="lab">Why it matters</div><p>${esc(n.effect)}</p>` +
    (n.ask ? `<div class="ask"><b>Ask the class</b><p>${esc(n.ask)}</p></div>` : "") + tiers +
    `<div class="tagrow">${n.tags.map((t) => `<span class="chip tg-${t}"><i class="dot"></i>${esc(DATA.TAGS[t])}</span>`).join("")}</div>` +
    `<div class="notenav"><button data-act="pn">◀ Previous note</button><button data-act="nn">Next note ▶</button></div>`;
}
function scenePanel(st) {
  return `<p class="lead">${esc(st.setup)}</p>` +
    (st.think ? `<div class="think"><b>Think first</b><p>${esc(st.think)}</p><button class="ghost small" data-act="timer" data-sec="${st.thinkSecs || 30}">Start timer</button></div>` : "") +
    `<button class="ghost" data-act="firstnote">Open the first note</button>`;
}

/* ---------- what each step shows: one main focus, the rest in drawers ---------- */
const VIEW = {
  aims(st) {
    const A = DATA.hours[S.h].aims;
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: A.bridge || "", rail: "Aims",
      body: `<div class="inner aimsbody"><div class="li"><div class="lab">Learning intention</div><p>${esc(A.li)}</p></div>` +
        `<div class="sc"><div class="lab">Success criteria: by the end of the lesson I can…</div><ul>${A.sc.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>${A.stretch ? `<p class="stretchsc"><b>Stretch:</b> ${esc(A.stretch)}</p>` : ""}</div></div>`,
      drawers: [
        { id: "donow", label: "Do now", cta: true, title: st.doNow.title, html: () => `<p class="hint">Talk in pairs first. Tap a question to check.</p>${qaCards(st.doNow.qa)}<div class="row"><button class="ghost" data-act="timer" data-sec="60">Start a 1-minute timer</button></div>` },
        { id: "word", label: "Word of the lesson", title: "Word of the lesson", html: () => `<div class="word"><b>${esc(A.word.w)}</b> means ${esc(A.word.m)} ${esc(A.word.eg)}</div>` },
      ],
    };
  },
  context(st) {
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.lead, rail: "Cards",
      body: `<div class="inner"><div class="cards">${st.blocks.map((b) => `<div class="fact card" role="button" tabindex="0" data-reveal><h3>${esc(b.h)}</h3><p class="prompt">${esc(b.prompt || "")}</p><p class="txt">${esc(b.t)}</p><span class="tap">Talk first, then tap to check</span></div>`).join("")}</div></div>`,
      drawers: [{ id: "ideas", label: st.side.title, title: st.side.title, html: () => ideas(st.side.items) }],
    };
  },
  extract(st) {
    const phr = {}, rng = {}, stg = {};
    st.notes.forEach((n) => {
      if (n.phrase) { if (n.stage) (stg[n.stage] = stg[n.stage] || []).push(n); else (phr[n.at] = phr[n.at] || []).push(n); }
      else for (let i = n.from; i <= n.to; i++) rng[i] = n;
    });
    const body = st.lines.map((l) => {
      if (l.k === "sp") return `<div class="sp">${esc(l.t)}</div>`;
      if (l.k === "gap") return `<div class="gapline">${fmt(l.t)}</div>`;
      if (l.k === "st") return `<div class="stg">${l.key && stg[l.key] ? annSpans(l.t, stg[l.key]) : fmt(l.t)}</div>`;
      const r = rng[l.n];
      const num = l.n % 5 === 0 ? l.n : "";
      if (r) return `<div class="ln rng${match(r) ? "" : " dim"}" data-note="${r.id}" role="button" tabindex="0"><span class="num">${num}</span><span class="tx">${fmt(l.t)}</span></div>`;
      return `<div class="ln"><span class="num">${num}</span><span class="tx">${annSpans(l.t, phr[l.n] || [])}</span></div>`;
    }).join("");
    return {
      kick: `${st.label} · about ${st.mins} min`, title: st.title, sub: st.sub, rail: "Extract", focus: true,
      body: `<div class="lines">${body}</div><div class="foot">Tap an underlined phrase or highlighted line to open its note. Text: Folger Shakespeare Library edition (folger.edu). Line numbers as printed there.</div>`,
      drawers: [
        { id: "scene", label: "Before you read", title: "Before you read", cta: !!st.think, html: () => scenePanel(st) },
        { id: "note", label: () => `Notes (${visible(st).length})` },
      ],
    };
  },
  link(st) {
    const { html, bank } = clozeParts(st.text);
    const drawers = [];
    if (st.hinge) drawers.push({ id: "hinge", label: "Quick check", cta: true, title: "Quick check", html: () => hingeHTML(st.hinge) });
    if (st.ext) drawers.push({ id: "ext", label: "Stretch", title: "Stretch", html: () => `<p class="stretchsc"><b>Stretch:</b> ${esc(st.ext)}</p>` });
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: "Read aloud and tap each gap to reveal the word.", rail: "Gap-fill",
      actions: `<button class="tb" data-act="reveal">Reveal all</button>`,
      body: `<div class="inner"><div class="lab">Word bank</div><div class="bank">${bank.map((a) => `<span>${esc(a)}</span>`).join("")}</div><p class="cloze">${html}</p></div>`,
      drawers,
    };
  },
  plenary(st) {
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: "Answer on your handout first. Then tap a question to check.", rail: "Exit ticket",
      body: `<div class="inner">${qaCards(st.ticket)}</div>`,
      drawers: [
        { id: "rate", label: "Rate yourself", cta: true, title: "Rate yourself", html: () => `<p class="hint">How well can you do each of today’s success criteria?</p><div id="ratings">${ratingHTML(S.h)}</div>` },
        { id: "next", label: "What’s next", title: "What’s next", html: () => `<div class="track"><p>${esc(st.next)}</p></div>` },
      ],
    };
  },
  practice(st) {
    const kind = { mc: "Multiple choice", tf: "True or false", match: "Matching", short: "Write your answer" };
    const cards = st.qs.map((q) => {
      let body = `<div class="qq">${esc(q.q)}</div>`;
      if (q.k === "mc") body += `<ol class="opts opts-a">${q.opts.map((o) => `<li>${esc(o)}</li>`).join("")}</ol>`;
      if (q.k === "tf") body += `<ul class="opts">${q.items.map((o) => `<li>${esc(o)}</li>`).join("")}</ul>`;
      if (q.k === "match") body += `<div class="mt"><ul>${q.left.map((o) => `<li>${esc(o)}</li>`).join("")}</ul><ul>${q.right.map((o) => `<li>${esc(o)}</li>`).join("")}</ul></div>`;
      const ms = q.ms ? `<ul class="ms">${q.ms.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>` : "";
      return `<div class="qa" role="button" tabindex="0" data-qa><span class="lv">${kind[q.k]} · ${q.marks} mark${q.marks > 1 ? "s" : ""}</span>${body}<div class="aa">${esc(q.a)}${ms}</div></div>`;
    }).join("");
    const mins = Math.round((st.timer || 300) / 60);
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.sub, rail: "Questions",
      actions: `<button class="tb" data-act="timer" data-sec="${st.timer || 300}">${mins}-minute timer</button>`,
      body: `<div class="inner">${cards}</div>`,
      drawers: [{ id: "tips", label: st.tipsTitle, title: st.tipsTitle, html: () => ideas(st.tips) }],
    };
  },
  assess(st) {
    return { raw: `<section class="pane wide assess"><h2>${esc(st.title)}</h2><p class="sub">${esc(st.sub || "")}</p>` +
      `<div class="row">${st.presets.map((m) => `<button class="ghost primary big" data-act="timer" data-sec="${m * 60}">Start ${m} minutes</button>`).join("")}<button class="ghost big" data-act="tstop">Stop timer</button></div></section>`, drawers: [] };
  },
  spot(st) {
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.sub, rail: "Spot the irony",
      body: `<div class="inner">` + st.items.map((it, i) => `<div class="spotitem" role="button" tabindex="0" data-spot="${i}"><p class="sq">${esc(it.t)}</p><p class="sw" hidden>${esc(it.why)}</p></div>`).join("") +
        `<div class="row"><button class="ghost primary" data-act="spotcheck">Check my answers</button><button class="ghost" data-act="spotreset">Start again</button></div><p class="score" id="spotscore"></p></div>`,
      drawers: [{ id: "tips", label: st.tipsTitle, title: st.tipsTitle, html: () => ideas(st.tips) }],
    };
  },
  battle(st) {
    const B = S.battle, R = st.rounds, done = B.r >= R.length;
    let body;
    if (done) {
      body = `<div class="bcard"><p class="score">${B.meter >= 100 ? "Macbeth is settled." : "Macbeth is nearly convinced."}</p><p class="hres">${esc(st.end)}</p><button class="ghost primary" data-act="brestart">Play again</button></div>`;
    } else {
      const rd = R[B.r], p = B.picked;
      body = `<div class="bcard"><span class="lab">Round ${B.r + 1} of ${R.length}: Macbeth says</span><p class="q">${esc(rd.doubt)}</p><span class="lab">Lady Macbeth: choose your tactic</span>` +
        rd.opts.map((o, i) => `<button class="opt${p !== null ? (o.best ? " right" : i === p ? " wrong" : "") : ""}" data-bopt="${i}" ${p !== null ? "disabled" : ""}>${String.fromCharCode(65 + i)}&nbsp; ${esc(o.t)}</button>`).join("") +
        (p !== null ? `<p class="hres"><b>${rd.opts[p].best ? "Strong choice." : "Not quite."}</b> ${esc(rd.opts[p].why)}</p><button class="ghost primary" data-act="bnext">${B.r + 1 === R.length ? "See the result" : "Next round"}</button>` : "") + `</div>`;
    }
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.sub, rail: "Battle",
      headExtra: `<div class="mhead"><span>Macbeth’s resolve</span><div class="meter" role="img" aria-label="Macbeth’s resolve ${B.meter} percent"><div class="bar" style="width:${B.meter}%"></div></div><b>${B.meter}%</b></div>`,
      body: `<div class="inner">${body}</div>`,
      drawers: [{ id: "quote", label: "Use a quotation", title: "Use a quotation", html: () => `<div class="idea"><b>Use a quotation</b><p>Every strong tactic comes from a line in the extract. Say which line you would quote.</p></div>` }],
    };
  },
};

/* ---------- putting a step on screen ---------- */
function mainMarkup(v) {
  if (v.raw) return v.raw;
  const btns = v.drawers.map((d) => `<button class="tb${d.cta ? " cta" : ""}" data-drawer="${d.id}" aria-pressed="false">${esc(typeof d.label === "function" ? d.label() : d.label)}</button>`).join("");
  const focus = v.focus ? `<button class="tb" data-act="focus" title="Show only the extract (F)"><i class="ic ic-focus"></i>Focus</button>` : "";
  return `<section class="pane main" id="mainpane"><div class="phead"><div class="pt"><span class="kick">${esc(v.kick)}</span><h2>${esc(v.title)}</h2>${v.sub ? `<p class="sub">${esc(v.sub)}</p>` : ""}</div>` +
    `<div class="ptools">${btns}${v.actions || ""}${focus}</div>${v.headExtra || ""}</div><div class="pbody" id="script">${v.body}</div></section>`;
}
const drawerMarkup = () =>
  `<aside class="pane drawer" id="drawer" hidden aria-label="Side panel"><div class="dhead"><h3 id="dtitle"></h3><div class="dtools">` +
  `<button class="tb" data-act="dwide" title="Make this panel wider or narrower"><i class="ic ic-wide"></i><span id="lw">Wider</span></button>` +
  `<button class="tb" data-act="dfull" title="Hide the main pane to use the full width"><i class="ic ic-full"></i><span id="lf">Hide</span></button>` +
  `<button class="ib" data-act="dclose" aria-label="Close" title="Close (Esc)"><i class="ic ic-close"></i></button></div></div><div class="dbody" id="panel" aria-live="polite"></div></aside>` +
  `<button class="railtab" id="mainrail" data-act="showmain" hidden></button>`;

function mount(keep) {
  const el = $("#stage");
  const st = cur();
  const v = VIEW[st.type](st);
  DR = {}; v.drawers.forEach((d) => (DR[d.id] = d));
  const keepTop = keep && $("#script") ? $("#script").scrollTop : 0;
  if (!keep) { S.drawer = null; S.wide = false; S.mainHidden = false; S.sel = null; }
  el.innerHTML = mainMarkup(v) + drawerMarkup();
  S.rail = (v.rail || "main pane").toLowerCase();
  const rail = $("#mainrail"); if (rail) rail.textContent = "Show " + S.rail;
  if (S.drawer && S.drawer !== "note" && !DR[S.drawer]) S.drawer = null;
  if (S.drawer === "note" && !S.sel) S.drawer = null;
  layout();
  if (S.sel) markSel();
  const sc = $("#script"); if (sc) sc.scrollTop = keepTop;
}
function markSel() { document.querySelectorAll("[data-note]").forEach((el) => el.classList.toggle("on", el.dataset.note === S.sel)); }
function layout() {
  const c = $("#stage"), d = $("#drawer");
  const has = !!S.drawer && !!d;
  c.classList.toggle("has-drawer", has);
  c.classList.toggle("wide", has && S.wide);
  c.classList.toggle("mainhidden", has && S.mainHidden);
  if (d) d.hidden = !has;
  const rail = $("#mainrail"); if (rail) rail.hidden = !(has && S.mainHidden);
  document.querySelectorAll(".tb[data-drawer]").forEach((b) => { const on = b.dataset.drawer === S.drawer; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
  if (has) { fillDrawer(); $("#lw").textContent = S.wide ? "Narrower" : "Wider"; $("#lf").textContent = (S.mainHidden ? "Show " : "Hide ") + S.rail; }
}
function fillDrawer() {
  const st = cur();
  let title, html;
  if (S.drawer === "note") {
    const n = S.sel && byId(st, S.sel);
    if (!n) { closeDrawer(); return; }
    title = "Notes"; html = notePanel(st, n);
  } else { const dd = DR[S.drawer]; title = dd.title || (typeof dd.label === "string" ? dd.label : ""); html = dd.html(); }
  $("#dtitle").textContent = title;
  $("#panel").innerHTML = html;
  $("#panel").scrollTop = 0;
}
function openDrawer(id) { S.drawer = id; layout(); }
function closeDrawer() {
  if (S.drawer === "note") S.sel = null;
  S.drawer = null; S.wide = false; S.mainHidden = false; markSel(); layout();
}
function select(id) {
  S.sel = id; S.drawer = "note"; markSel(); layout();
  const first = document.querySelector(`[data-note="${id}"]`);
  if (first) setTimeout(() => first.scrollIntoView({ block: "center", behavior: reduced() ? "auto" : "smooth" }), 40);
}
function stepNote(d) {
  const st = cur(), vis = visible(st);
  if (!vis.length) return;
  let i = vis.findIndex((n) => n.id === S.sel);
  i = i < 0 ? (d > 0 ? 0 : vis.length - 1) : (i + d + vis.length) % vis.length;
  select(vis[i].id);
}
function setFocus(on) {
  if (on && cur().type !== "extract") return;
  S.focus = on;
  document.body.classList.toggle("focus", on);
  $("#fctl").setAttribute("aria-hidden", String(!on));
  if (on) setTimeout(() => $("#unfocus").focus({ preventScroll: true }), 400);
  const sc = $("#script"); if (sc && on) sc.scrollTop = sc.scrollTop;
}

/* ---------- spot the irony ---------- */
function spotCheck() {
  const st = cur(), total = st.items.filter((i) => i.irony).length;
  let hit = 0, wrong = 0;
  document.querySelectorAll(".spotitem").forEach((el) => {
    const it = st.items[+el.dataset.spot], picked = el.classList.contains("picked");
    el.classList.remove("ok", "bad", "miss", "none");
    if (picked && it.irony) { el.classList.add("ok"); hit++; }
    else if (picked) { el.classList.add("bad"); wrong++; }
    else if (it.irony) el.classList.add("miss");
    else el.classList.add("none");
    el.querySelector(".sw").hidden = false;
  });
  $("#spotscore").textContent = `You found ${hit} of ${total} ironic lines` + (wrong ? ` and picked ${wrong} that ${wrong === 1 ? "is" : "are"} not dramatic irony.` : ".");
}

/* ---------- navigation ---------- */
function renderAll() { renderTop(); renderNav(); renderFilters(); mount(false); }
function go(h, s) {
  if (S.focus) setFocus(false);
  S.h = h; S.s = s; S.sel = null; S.battle = { r: 0, meter: 20, picked: null };
  renderAll();
}
function move(d) {
  let h = S.h, s = S.s + d;
  if (s < 0) { if (h === 0) return; h--; s = DATA.hours[h].steps.length - 1; }
  else if (s >= DATA.hours[h].steps.length) { if (h === DATA.hours.length - 1) return; h++; s = 0; }
  go(h, s);
}

/* ---------- timer ---------- */
const T = { id: null, end: 0 };
const mmss = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function timerStart(sec) {
  clearInterval(T.id);
  const el = $("#timer"); el.hidden = false; el.classList.remove("done");
  T.end = Date.now() + sec * 1000;
  const tick = () => {
    const left = Math.max(0, Math.ceil((T.end - Date.now()) / 1000));
    $("#tt").textContent = left > 0 ? mmss(left) : "Time!";
    if (left <= 0) { clearInterval(T.id); el.classList.add("done"); }
  };
  tick(); T.id = setInterval(tick, 250);
}
function timerStop() { clearInterval(T.id); $("#timer").hidden = true; }

/* ---------- events ---------- */
function syncReveal(scope) {
  const btn = (scope || document).querySelector('[data-act="reveal"],[data-act="revealcard"]');
  if (!btn) return;
  const gaps = [...(scope || document).querySelectorAll(".gap")];
  btn.textContent = gaps.length && gaps.every((g) => g.classList.contains("open")) ? "Hide all" : "Reveal all";
}
function hingeMark(box, hg, picked) {
  box.querySelectorAll(".opt").forEach((o, j) => { o.classList.toggle("right", j === hg.correct); o.classList.toggle("wrong", picked !== null && j === picked && j !== hg.correct); });
  const res = box.querySelector(".hres"); res.hidden = false;
  res.innerHTML = `<b>${picked === null ? "Answer:" : picked === hg.correct ? "Correct." : "Not quite."}</b> ${esc(hg.why)}`;
}
function hidePops() {
  document.querySelectorAll(".pop").forEach((p) => { p.hidden = true; const b = p.parentElement.querySelector("button[aria-haspopup]"); if (b) b.setAttribute("aria-expanded", "false"); });
}
document.addEventListener("click", (e) => {
  const t = e.target;
  const pb = t.closest("button[aria-haspopup]");
  if (pb) {
    const p = pb.parentElement.querySelector(".pop"), wasHidden = p.hidden;
    hidePops(); p.hidden = !wasHidden; pb.setAttribute("aria-expanded", String(wasHidden));
    return;
  }
  if (!t.closest(".pop")) hidePops();
  const dr = t.closest("[data-drawer]");
  if (dr) {
    const id = dr.dataset.drawer;
    if (S.drawer === id) closeDrawer();
    else if (id === "note") { if (S.sel && visible(cur()).some((n) => n.id === S.sel)) select(S.sel); else stepNote(1); }
    else { if (S.drawer === "note") S.sel = null; markSel(); openDrawer(id); }
    return;
  }
  const note = t.closest("[data-note]");
  if (note) { select(note.dataset.note); return; }
  const gap = t.closest("[data-gap]");
  if (gap) { gap.classList.toggle("open"); syncReveal(gap.closest(".gapcard") || document); return; }
  const qa = t.closest("[data-qa]");
  if (qa) { qa.classList.toggle("open"); return; }
  const fact = t.closest("[data-reveal]");
  if (fact) { fact.classList.toggle("open"); return; }
  const sp = t.closest("[data-spot]");
  if (sp) { if (!/\b(ok|bad|miss|none)\b/.test(sp.className)) sp.classList.toggle("picked"); return; }
  const bo = t.closest("[data-bopt]");
  if (bo) {
    const B = S.battle, rd = cur().rounds[B.r];
    if (B.picked === null) { B.picked = +bo.dataset.bopt; B.meter = Math.min(100, B.meter + rd.opts[B.picked].pts); mount(true); }
    return;
  }
  const hb = t.closest("[data-hinge]");
  if (hb) { hingeMark(hb.closest(".hinge"), cur().hinge, +hb.dataset.hinge); return; }
  const rate = t.closest("[data-rate]");
  if (rate) {
    const [h, i, v] = rate.dataset.rate.split(":");
    S.rate[h + ":" + i] = +v; saveRate();
    const box = rate.closest("#ratings, .ratings-h");
    if (box) box.innerHTML = ratingHTML(+h);
    return;
  }
  const b = t.closest("button");
  if (!b) return;
  if (b.closest("#tmenu")) { timerStart(+b.dataset.sec); hidePops(); return; }
  if (b.dataset.h !== undefined) { hidePops(); return go(+b.dataset.h, 0); }
  if (b.dataset.s !== undefined) return go(S.h, +b.dataset.s);
  if (b.dataset.tag !== undefined) {
    S.tag = b.dataset.tag;
    const st = cur();
    if (S.sel && !match(byId(st, S.sel))) { S.sel = null; if (S.drawer === "note") S.drawer = null; }
    renderFilters(); mount(true);
    return;
  }
  switch (b.dataset.act) {
    case "next": move(1); break;
    case "prev": move(-1); break;
    case "nn": stepNote(1); break;
    case "pn": stepNote(-1); break;
    case "firstnote": stepNote(1); break;
    case "dclose": closeDrawer(); break;
    case "dwide": S.wide = !S.wide; S.mainHidden = false; layout(); break;
    case "dfull": S.mainHidden = !S.mainHidden; layout(); break;
    case "showmain": S.mainHidden = false; layout(); break;
    case "focus": setFocus(true); break;
    case "unfocus": setFocus(false); break;
    case "tog": { const el = $("#panel ." + b.dataset.t); if (el) { el.hidden = !el.hidden; if (!el.hidden) el.scrollIntoView({ block: "nearest" }); } break; }
    case "timer": timerStart(+b.dataset.sec); break;
    case "spotcheck": spotCheck(); break;
    case "spotreset": mount(true); break;
    case "bnext": S.battle.r++; S.battle.picked = null; mount(true); break;
    case "brestart": S.battle = { r: 0, meter: 20, picked: null }; mount(true); break;
    case "tstop": timerStop(); break;
    case "hingeshow": hingeMark(b.closest(".hinge"), cur().hinge, null); break;
    case "reveal": case "revealcard": {
      const scope = b.closest(".gapcard") || document;
      const gaps = scope.querySelectorAll(".gap");
      const allOpen = [...gaps].every((g) => g.classList.contains("open"));
      gaps.forEach((g) => g.classList.toggle("open", !allOpen));
      syncReveal(scope);
      break;
    }
  }
});
document.addEventListener("keydown", (e) => {
  const tg = e.target instanceof Element ? e.target : document.body;
  if ((e.key === "Enter" || e.key === " ") && tg.matches("[role=button]")) { e.preventDefault(); tg.click(); return; }
  if (tg.matches("input,textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Escape") {
    if ([...document.querySelectorAll(".pop")].some((p) => !p.hidden)) hidePops();
    else if (S.focus) setFocus(false);
    else if (S.drawer) closeDrawer();
    return;
  }
  if (e.key === "f" || e.key === "F") { setFocus(!S.focus); return; }
  if (S.focus) return;
  if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "]") stepNote(1);
  else if (e.key === "[") stepNote(-1);
});

/* tools */
function setScale(d) {
  S.scale = Math.min(1.6, Math.max(0.75, +(S.scale + d).toFixed(2)));
  document.documentElement.style.setProperty("--scale", S.scale);
}
["#fsm", "#ffm"].forEach((id) => $(id).addEventListener("click", () => setScale(-0.1)));
["#fsp", "#ffp"].forEach((id) => $(id).addEventListener("click", () => setScale(0.1)));
function effectiveTheme() { return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function syncTheme() { $("#theme").textContent = effectiveTheme() === "dark" ? "Day mode" : "Night mode"; }
$("#theme").addEventListener("click", () => { document.documentElement.dataset.theme = effectiveTheme() === "dark" ? "light" : "dark"; syncTheme(); });
$("#full").addEventListener("click", () => {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (err) { /* not available */ }
});
syncTheme();
renderAll();
</script>
</body>
</html>
